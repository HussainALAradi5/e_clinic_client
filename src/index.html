<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>e-Clinic</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <!-- Apply the saved light / dark choice before the first paint (no flash). Same key as ThemeService. -->
    <script>
      try {
        var mode = JSON.parse(localStorage.getItem('ec.ui') || '{}').mode;
        document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <!-- Boot splash: same markup / CSS as <ui-page-loader>; Angular replaces it when the app starts. -->
    <app-root>
      <div class="page-loader" role="status" aria-live="polite">
        <svg class="page-loader-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" />
          <path d="M13.2 7.5h5.6v5.7h5.7v5.6h-5.7v5.7h-5.6v-5.7H7.5v-5.6h5.7z" />
        </svg>
        <svg class="page-loader-pulse" viewBox="0 0 120 24" aria-hidden="true">
          <polyline points="0,12 38,12 46,12 52,3 60,21 66,12 74,12 120,12" />
        </svg>
        <span class="page-loader-label">Loading e-Clinic</span>
      </div>
    </app-root>
  </body>
</html>
