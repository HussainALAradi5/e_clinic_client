<header class="mb-4 flex flex-wrap items-end justify-between gap-3">
  <div>
    <h1 class="m-0 text-2xl font-bold tracking-tight">{{ text.myVisits }}</h1>
    <p class="m-0 text-on-surface-variant">{{ text.showTheCheckIn }}</p>
  </div>
  <a matButton="filled" [routerLink]="bookPath"><mat-icon>add</mat-icon> {{ text.bookAVisit }}</a>
</header>

<div class="mb-4 flex flex-wrap items-start gap-3">
  <ui-enum-filter enum="VisitTiming" [label]="text.whichVisits" [(value)]="timing" />
  <ui-date-range-filter
    class="w-64"
    [fields]="dateFields"
    [value]="dates()"
    (valueChange)="dates.set($event)"
  />
</div>

@if (visits(); as list) {
  <div class="space-y-2">
    @for (v of list; track v.id) {
      <app-visit-card [visit]="v" (changed)="changed($event)" />
    } @empty {
      <ui-empty icon="event" [title]="empty().title" [message]="empty().message" />
    }
  </div>
  @if (more()) {
    <div class="mt-4 text-center">
      <button matButton (click)="load(true)">{{ text.showMore }}</button>
    </div>
  }
} @else {
  <ui-skeleton [rows]="5" [height]="56" />
}
