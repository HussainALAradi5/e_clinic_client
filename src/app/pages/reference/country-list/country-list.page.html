<ui-resource-list
  resource="countries"
  endpoint="reference/countries"
  [title]="text.countries"
  [subtitle]="text.usedForNationalitiesAddresses"
  [emptyTitle]="text.noCountriesMatch"
  (rowClick)="edit($event)"
>
  <ng-template uiCell="code" let-row>
    <ui-flag [code]="row.code" />
    <span class="ml-1 tabular-nums">{{ row.code }}</span>
  </ng-template>
  <ng-template uiCell="is_active" let-row>{{ row.isActive ? text.yes : text.hidden }}</ng-template>
</ui-resource-list>
