<ui-resource-list
  resource="companies"
  endpoint="reference/companies"
  [title]="text.companies"
  [subtitle]="text.manufacturersSuppliersInsurersExternal"
  [emptyTitle]="text.noCompaniesFound"
  rowLink="/reference/companies/:id"
>
  <ui-button actions icon="add_business" access="companies.create" [action]="create">{{
    text.newCompany
  }}</ui-button>

  <ng-template uiCell="name" let-row>
    <span class="font-medium">{{ row.name }}</span>
  </ng-template>
  <ng-template uiCell="country_code" let-row>
    <ui-flag [code]="row.countryCode" />
    {{ row.country?.name ?? row.countryCode }}
  </ng-template>
  <ng-template uiCell="contact_person" let-row>{{ row.contactPerson ?? '—' }}</ng-template>
</ui-resource-list>
