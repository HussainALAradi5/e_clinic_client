<ui-resource-list
  resource="roles"
  title="Roles & permissions"
  subtitle="A user's rights are the sum of their roles. System roles cannot be renamed or deleted."
  rowLink="/system/roles-permissions/:id"
>
  <ui-button actions icon="add" access="roles.create" [action]="create">New role</ui-button>

  <ng-template uiCell="display_name" let-row>
    <span class="font-medium">{{ row.displayName }}</span>
    @if (row.isSystem) {
      <mat-icon
        class="ml-1 !size-4 align-middle !text-base text-on-surface-variant"
        title="System role"
        >lock</mat-icon
      >
    }
  </ng-template>
  <ng-template uiCell="users_count" let-row>
    <!-- Opens the role on its Members tab: who holds it, with search and pages. -->
    <a
      class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-primary hover:bg-primary-container"
      [routerLink]="['/system/roles-permissions', row.id]"
      [queryParams]="{ tab: 'members' }"
      (click)="$event.stopPropagation()"
      [attr.aria-label]="
        'See the ' + row.usersCount + ' users with the ' + row.displayName + ' role'
      "
    >
      <mat-icon class="!size-4 !text-base">group</mat-icon>
      <span class="tabular-nums">{{ row.usersCount ?? 0 }}</span>
    </a>
  </ng-template>
</ui-resource-list>
