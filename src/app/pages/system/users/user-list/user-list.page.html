<ui-resource-list
  resource="users"
  [title]="text.users"
  [subtitle]="text.loginAccountsOfStaff"
  rowLink="/system/users/:id"
  [columns]="columns"
>
  <ng-template uiCell="full_name" let-row>
    <span class="font-medium">{{ row.fullName }}</span>
  </ng-template>
  <ng-template uiCell="last_login_at" let-row>
    {{ row.lastLoginAt ? (row.lastLoginAt | relativeTime) : text.never }}
  </ng-template>
</ui-resource-list>
