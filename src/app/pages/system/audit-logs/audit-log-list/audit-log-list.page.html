<ui-resource-list
  resource="audit"
  endpoint="audit-logs"
  [title]="text.auditLogs"
  [subtitle]="text.whoDidWhatAnd"
  [emptyTitle]="text.noActivityInThis"
  [defaults]="defaults"
  (rowClick)="open($event)"
>
  <ng-template uiCell="created_at" let-row>
    <span class="whitespace-nowrap tabular-nums">{{ row.createdAt | date: dateTimeFormat() }}</span>
  </ng-template>
  <ng-template uiCell="user" let-row>{{ row.user?.fullName ?? text.system }}</ng-template>
  <ng-template uiCell="auditable" let-row>
    {{ row.auditableType ? humanise(row.auditableType) : '—' }}
    @if (row.auditableId) {
      <span class="font-mono text-xs text-on-surface-variant">{{
        row.auditableId.slice(0, 8)
      }}</span>
    }
  </ng-template>
</ui-resource-list>
