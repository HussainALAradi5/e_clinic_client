<ui-resource-list
  resource="orders"
  endpoint="clinical-orders"
  [title]="text.clinicalOrders"
  [subtitle]="text.imagingLabTestsEcgs"
  [emptyTitle]="text.noOrdersFound"
  rowLink="/clinic/clinical-orders/:id"
  [params]="params()"
>
  <ui-enum-filter
    quick
    class="mb-3 block"
    enum="ClinicalOrderType"
    [label]="text.kindOfOrder"
    [(value)]="type"
  />
  <a actions matButton="filled" routerLink="/clinic/clinical-orders/worklist"
    ><mat-icon>checklist</mat-icon> {{ text.workList }}</a
  >
  <ng-template uiCell="code" let-row
    ><span class="font-mono">{{ row.code }}</span></ng-template
  >
  <ng-template uiCell="patient" let-row>
    <span class="font-medium">{{ row.patient?.fullName }}</span>
    <span class="block text-xs text-on-surface-variant">{{ row.patient?.code }}</span>
  </ng-template>
  <ng-template uiCell="description" let-row>
    {{ row.description }}
    @if (row.isAbnormal) {
      <span
        class="ml-2 rounded-full bg-error-container px-2 py-0.5 text-[11px] font-medium text-on-error-container"
        >{{ text.abnormal }}</span
      >
    }
  </ng-template>
  <ng-template uiCell="ordered_by" let-row>{{ row.orderingDoctor?.fullName }}</ng-template>
  <ng-template uiCell="created_at" let-row>{{ row.createdAt | date: dateFormat }}</ng-template>
</ui-resource-list>
