<ui-resource-list
  resource="treatments"
  endpoint="treatments"
  [title]="text.treatments"
  [subtitle]="text.plansOfSessionsPhysiotherapy"
  [emptyTitle]="text.noTreatmentsFound"
  rowLink="/clinic/treatments/:id"
>
  <ng-container actions>
    <a matButton="outlined" routerLink="/clinic/treatments/queue"
      ><mat-icon>low_priority</mat-icon> {{ text.schedulingQueue }}</a
    >
    <ui-button icon="add" access="treatments.create" [action]="prescribe">{{
      text.prescribe
    }}</ui-button>
  </ng-container>
  <ng-template uiCell="title" let-row>
    <span class="block max-w-52 truncate font-medium" [title]="row.title">{{ row.title }}</span>
    <span class="block font-mono text-xs text-on-surface-variant">{{ row.code }}</span>
  </ng-template>
  <ng-template uiCell="patient" let-row>
    <span class="font-medium">{{ row.patient?.fullName }}</span>
    <span class="block text-xs text-on-surface-variant">{{ row.patient?.code }}</span>
  </ng-template>
  <ng-template uiCell="doctor" let-row>{{ row.doctor?.fullName }}</ng-template>
  <ng-template uiCell="progress" let-row>
    @if (row.progress; as p) {
      <ui-progress-meter class="w-36" [progress]="p" [status]="row.status" [compact]="true" />
    }
  </ng-template>
  <ng-template uiCell="created_at" let-row>{{ row.createdAt | date: dateFormat }}</ng-template>
</ui-resource-list>
