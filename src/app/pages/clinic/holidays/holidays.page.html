<ui-page-header [title]="text.clinicHolidays" [subtitle]="text.closedDaysForEveryone">
  <ui-button actions icon="add" access="schedules.create & schedules.read_all" [action]="add">{{
    text.addHoliday
  }}</ui-button>
</ui-page-header>

<mat-card appearance="outlined" class="max-w-2xl !p-5">
  @for (h of holidays() ?? []; track h.id) {
    <div
      class="flex items-center gap-4 border-b border-outline-variant/60 py-2.5 text-sm last:border-0"
    >
      <span class="w-56 font-medium">{{ h.date | date: dateFormat }}</span>
      <span class="flex-1 text-on-surface-variant">{{ h.reason ?? text.holiday }}</span>
      <ui-button
        icon="delete"
        [variant]="variants.Text"
        access="schedules.delete & schedules.read_all"
        [confirm]="{
          title: text.removeThisHoliday,
          message: text.normalHoursApplyThat,
          confirmLabel: text.remove,
        }"
        [action]="remove.bind(this, h)"
        >{{ text.remove }}</ui-button
      >
    </div>
  } @empty {
    <p class="m-0 text-sm text-on-surface-variant">{{ text.noHolidaysInThe }}</p>
  }
</mat-card>
