<ui-resource-list
  resource="rooms"
  endpoint="rooms"
  [title]="text.rooms"
  [subtitle]="text.eachBookingTypeUses"
  [emptyTitle]="text.noRoomsFound"
  rowLink="/clinic/rooms/:id"
>
  <ui-button actions icon="add" access="rooms.create" [action]="create">{{
    text.newRoom
  }}</ui-button>
  <ng-template uiCell="code" let-row
    ><span class="font-mono">{{ row.code }}</span></ng-template
  >
  <ng-template uiCell="name" let-row
    ><span class="font-medium">{{ row.name }}</span></ng-template
  >
  <ng-template uiCell="department" let-row>{{ row.department?.name ?? '—' }}</ng-template>
  <ng-template uiCell="is_in_service" let-row>
    @if (row.isInService) {
      <span class="text-primary">{{ text.inService }}</span>
    } @else {
      <span class="text-error">{{ text.out }} {{ row.outOfServiceReason }}</span>
    }
  </ng-template>
</ui-resource-list>
