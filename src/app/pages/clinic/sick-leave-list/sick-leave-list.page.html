<ui-resource-list
  resource="sick_leaves"
  endpoint="sick-leaves"
  [title]="text.sickLeaves"
  [subtitle]="text.certificatesIssuedAtVisits"
  [emptyTitle]="text.noSickLeavesFound"
  (rowClick)="open($any($event))"
>
  <ng-template uiCell="code" let-row>
    <span class="font-mono" [class.line-through]="row.isCancelled">{{ row.code }}</span>
    @if (row.isCancelled) {
      <span class="ml-2 text-xs font-semibold text-error">{{ text.cancelled }}</span>
    }
  </ng-template>
  <ng-template uiCell="patient" let-row
    ><span class="font-medium">{{ row.patient.fullName }}</span>
    <span class="block text-xs text-on-surface-variant">{{ row.patient.code }}</span></ng-template
  >
  <ng-template uiCell="start_date" let-row>{{ row.startDate | date: dateFormat }}</ng-template>
  <ng-template uiCell="end_date" let-row>{{ row.endDate | date: dateFormat }}</ng-template>
  <ng-template uiCell="days" let-row
    ><span class="tabular-nums">{{ row.days }}</span></ng-template
  >
  <ng-template uiCell="doctor" let-row>{{ row.doctor.fullName }}</ng-template>
  <ng-template uiCell="issued_at" let-row>{{ row.issuedAt | date: dateFormat }}</ng-template>
</ui-resource-list>
