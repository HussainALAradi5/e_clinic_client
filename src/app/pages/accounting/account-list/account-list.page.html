<ui-resource-list
  resource="accounts"
  endpoint="accounting/accounts"
  [title]="text.chartOfAccounts"
  [subtitle]="text.groupAndPostingAccounts"
  [emptyTitle]="text.noAccountsFound"
  rowLink="/accounting/chart-of-accounts/:id"
>
  <ng-container actions>
    <a matButton="outlined" routerLink="tree"><mat-icon>account_tree</mat-icon> {{ text.tree }}</a>
    <a matButton="outlined" routerLink="mappings"
      ><mat-icon>alt_route</mat-icon> {{ text.postingAccounts }}</a
    >
    <ui-button icon="add" access="accounts.create" [action]="create">{{
      text.newAccount
    }}</ui-button>
  </ng-container>

  <ng-template uiCell="code" let-row>
    <span class="font-mono tabular-nums">{{ row.code }}</span>
  </ng-template>
  <ng-template uiCell="name" let-row>
    <span [class.font-semibold]="row.isGroup" [style.padding-left.rem]="(row.level - 1) * 0.75">{{
      row.name
    }}</span>
  </ng-template>
  <ng-template uiCell="parent" let-row>{{
    row.parent ? row.parent.code + ' ' + row.parent.name : '—'
  }}</ng-template>
  <ng-template uiCell="is_group" let-row>{{ row.isGroup ? text.group : text.posting }}</ng-template>
</ui-resource-list>
