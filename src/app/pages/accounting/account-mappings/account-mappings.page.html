<ui-page-header [title]="text.postingAccounts" [subtitle]="text.paymentsInvoicesPayrollAnd">
  <a actions matButton="outlined" routerLink="/accounting/chart-of-accounts"
    ><mat-icon>list</mat-icon> {{ text.chartOfAccounts }}</a
  >
</ui-page-header>

@if (error(); as e) {
  <ui-error [error]="e" (retry)="load()" />
} @else if (mappings(); as rows) {
  <ui-form
    [form]="form"
    [submit]="save"
    [submitLabel]="text.savePostingAccounts"
    [cancelLabel]="null"
  >
    <div class="grid gap-x-6 md:grid-cols-2">
      @for (mapping of rows; track mapping.key) {
        <div
          class="grid grid-cols-1 items-start gap-1 border-b border-outline-variant/60 py-2 sm:grid-cols-[13rem_1fr] sm:gap-4"
        >
          <div class="pt-3 text-sm">
            <span class="font-medium">{{ mapping.label }}</span>
            <span class="block text-xs text-on-surface-variant"
              >{{ mapping.accountType | enumLabel: 'AccountType' }} {{ text.account }}</span
            >
          </div>
          <ui-entity-select
            [label]="text.accountLabel"
            endpoint="accounting/accounts"
            [display]="accountName"
            [filter]="filterFor(mapping)"
            [initial]="$any(mapping.account)"
            [control]="form.controls[mapping.key]"
          />
        </div>
      }
    </div>
  </ui-form>
} @else {
  <ui-skeleton [rows]="8" />
}
