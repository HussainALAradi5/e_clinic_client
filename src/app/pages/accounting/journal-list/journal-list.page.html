<ui-resource-list
  resource="journal"
  endpoint="accounting/journal-entries"
  [title]="text.journal"
  [subtitle]="text.everyInvoicePaymentRefund"
  [emptyTitle]="text.noJournalEntriesFound"
  rowLink="/accounting/journal/:id"
>
  <ui-button actions icon="add" access="journal.create" [action]="create">{{
    text.newEntry
  }}</ui-button>
  <ng-template uiCell="entry_number" let-row
    ><span class="font-mono">{{ row.entryNumber ?? text.draft }}</span></ng-template
  >
  <ng-template uiCell="code" let-row
    ><span class="font-mono text-on-surface-variant">{{ row.code }}</span></ng-template
  >
  <ng-template uiCell="entry_date" let-row>{{ row.entryDate | date: dateFormat }}</ng-template>
  <ng-template uiCell="description" let-row
    ><span class="line-clamp-2 max-w-md">{{ row.description }}</span></ng-template
  >
  <ng-template uiCell="total_debit" let-row
    ><span class="tabular-nums">{{ row.totalDebit | money }}</span></ng-template
  >
</ui-resource-list>
