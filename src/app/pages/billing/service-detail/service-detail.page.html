@if (detail.error(); as error) {
  <ui-error [error]="error" (retry)="detail.load(id())" />
} @else if (detail.record(); as service) {
  <ui-page-header
    [title]="service.name"
    [subtitle]="service.code + ' · ' + (service.category | enumLabel: 'ServiceCategory')"
  >
    <ui-entity-actions
      actions
      resource="services"
      noun="service"
      [record]="service"
      [deleteBlocked]="usage().length > 0"
      [edit]="edit"
      [archive]="archive"
      [unarchive]="unarchive"
      [remove]="remove"
      [restore]="restore"
    />
  </ui-page-header>
  <mat-tab-group mat-stretch-tabs="false" animationDuration="0ms">
    <mat-tab [label]="text.details">
      <div class="grid gap-4 pt-4 lg:grid-cols-[minmax(0,1fr)_320px]">
        <mat-card appearance="outlined" class="!p-5"><ui-facts [items]="facts()" /></mat-card>
        <mat-card appearance="outlined" class="!p-5">
          <h2 class="m-0 mb-2 text-base font-semibold">{{ text.usedBy }}</h2>
          @for (entry of usage(); track entry[0]) {
            <div class="flex justify-between py-1 text-sm">
              <span>{{ label(entry[0]) }}</span
              ><span class="tabular-nums">{{ entry[1] }}</span>
            </div>
          } @empty {
            <p class="m-0 text-sm text-on-surface-variant">{{ text.notUsedYet }}</p>
          }
          @if (usage().length) {
            <p class="mb-0 mt-2 text-xs text-on-surface-variant">
              {{ text.aServiceInUse }}
            </p>
          }
        </mat-card>
      </div>
    </mat-tab>
    <mat-tab [label]="text.history" *hasAccess="'audit.read_all | audit.read_own'">
      <ng-template matTabContent
        ><ui-audit-history class="block pt-4" type="billable_service" [id]="service.id"
      /></ng-template>
    </mat-tab>
  </mat-tab-group>
} @else {
  <ui-skeleton [rows]="8" />
}
