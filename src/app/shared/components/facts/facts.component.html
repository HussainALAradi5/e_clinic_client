<dl class="m-0 grid grid-cols-[minmax(7rem,max-content)_1fr] gap-x-6 gap-y-2 text-sm">
  @for (item of items(); track item.label) {
    <dt class="text-on-surface-variant">{{ item.label }}</dt>
    <dd class="m-0 break-words" [class.font-mono]="item.mono" [class.tabular-nums]="item.mono">
      @if (item.value === null || item.value === undefined || item.value === '') {
        —
      } @else if (item.enum) {
        <ui-status [enum]="item.enum" [value]="item.value" />
      } @else if (item.flag) {
        <span
          class="inline-flex items-center gap-1.5 rounded-full border border-outline-variant px-2.5 py-0.5 text-xs font-medium"
        >
          <ui-flag [code]="item.flag" />{{ item.value }}
        </span>
      } @else {
        {{ item.value }}
      }
    </dd>
  }
</dl>
