<ng-content />

@switch (mark()) {
  @case ('corner') {
    <svg class="brand-surface-cross" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M13.2 7.5h5.6v5.7h5.7v5.6h-5.7v5.7h-5.6v-5.7H7.5v-5.6h5.7z" />
    </svg>
  }
  @case ('field') {
    <svg class="brand-surface-field" viewBox="0 0 400 400" aria-hidden="true">
      @for (row of grid; track row) {
        @for (col of grid; track col) {
          <path
            [attr.transform]="'translate(' + col * 50 + ' ' + row * 50 + ')'"
            d="M21 14h8v7h7v8h-7v7h-8v-7h-7v-8h7z"
          />
        }
      }
    </svg>
  }
}
