<div class="flex gap-1" aria-hidden="true">
  @for (bar of bars; track bar) {
    <span class="h-1 flex-1 rounded-full" [class]="barClass(bar)"></span>
  }
</div>
<ul
  class="m-0 mt-2 grid list-none grid-cols-2 gap-x-3 gap-y-1 p-0 text-xs"
  aria-label="Password rules"
>
  @for (check of checks(); track check.label) {
    <li
      class="flex items-center gap-1"
      [class]="check.ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-on-surface-variant'"
    >
      <mat-icon class="!size-4 !text-base">{{
        check.ok ? 'check_circle' : 'radio_button_unchecked'
      }}</mat-icon>
      {{ check.label }}
    </li>
  }
</ul>
