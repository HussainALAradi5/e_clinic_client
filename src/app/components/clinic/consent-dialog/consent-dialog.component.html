<h2 mat-dialog-title>{{ text.recordConsent }} {{ data.patient.fullName }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.saveConsent"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.consentTo"
        enum="ConsentType"
        [required]="true"
        [control]="form.controls.type"
      />
      @if (!patientWide() && scopes.length > 1) {
        <ui-select
          [label]="text.covers"
          [required]="true"
          [options]="scopes"
          [control]="form.controls.scope"
        />
      }
      <ui-text
        class="sm:col-span-2"
        [label]="text.whatWasExplained"
        [hint]="text.adaptToThisPatient"
        [multiline]="true"
        [rows]="4"
        [control]="form.controls.description"
      />
      <ui-text [label]="text.signedBy" [control]="form.controls.signedByName" />
      <ui-select
        [label]="text.signerIs"
        [required]="true"
        [options]="relationships"
        [hint]="minor ? text.under18AParent : null"
        [control]="form.controls.signerRelationship"
      />
      <ui-select
        [label]="text.witnessOptional"
        [options]="witnesses()"
        [control]="form.controls.witnessId"
      />
      <ui-text
        [label]="text.validUntilOptional"
        type="date"
        [hint]="text.emptyUntilRevoked"
        [control]="form.controls.validUntil"
      />
    </div>
    <p class="m-0 mb-2 flex items-center gap-2 text-sm font-medium">
      <mat-icon class="!text-lg">draw</mat-icon> {{ text.signedForm }}
    </p>
    <ui-upload-zone
      [category]="formCategory"
      [owner]="owner"
      [multiple]="false"
      accept="image/*,.pdf"
      (uploaded)="scanned($event)"
    />
    <p class="m-0 mt-1 text-xs text-on-surface-variant">
      {{ text.scanOrPhotographThe }}
    </p>
  </ui-form>
</mat-dialog-content>
