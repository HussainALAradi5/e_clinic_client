<h2 mat-dialog-title>{{ text.bookAnAppointment }}</h2>
<mat-dialog-content>
  <mat-stepper #stepper [linear]="true" animationDuration="200ms">
    <mat-step [stepControl]="who" [label]="text.patient">
      <div class="pt-3">
        <ui-entity-select
          [label]="text.patient"
          endpoint="patients"
          icon="person_search"
          [hint]="text.nameFileNumberOr"
          [autofocus]="true"
          [display]="patientName"
          [detail]="patientDetail"
          [initial]="patient()"
          [control]="who.controls.patientId"
          (picked)="patient.set($event)"
        />
        <div class="mt-2 flex flex-wrap items-center gap-2">
          @if (canRegister) {
            <ui-button icon="person_add" [variant]="variants.Text" [action]="register">{{
              text.newPatient
            }}</ui-button>
          }
          <span class="flex-1"></span>
          <button matButton="filled" matStepperNext type="button" [disabled]="who.invalid">
            {{ text.next }}
          </button>
        </div>
      </div>
    </mat-step>

    <mat-step [stepControl]="what" [label]="text.visit">
      <div class="grid grid-cols-1 gap-x-4 pt-3 sm:grid-cols-2">
        <ui-select
          [label]="text.type"
          [required]="true"
          [options]="types"
          [control]="what.controls.type"
        />
        <ui-select
          [label]="text.bookedBy"
          [required]="true"
          [options]="sources"
          [control]="what.controls.source"
        />
        <ui-entity-select
          class="sm:col-span-2"
          [label]="text.doctor"
          endpoint="doctors"
          icon="stethoscope"
          [display]="doctorName"
          [detail]="doctorDetail"
          [filter]="bookable"
          [initial]="doctor()"
          [control]="what.controls.providerId"
          (picked)="pickDoctor($event)"
        />
        <ui-entity-select
          class="sm:col-span-2"
          [label]="text.roomOptional"
          endpoint="rooms"
          [hint]="text.theDoctorsUsualRoom"
          [display]="roomName"
          [filter]="visitRooms"
          [initial]="$any(doctor()?.defaultRoom ?? null)"
          [control]="what.controls.roomId"
        />
      </div>
      <div class="flex gap-2">
        <button matButton matStepperPrevious type="button">{{ text.back }}</button>
        <span class="flex-1"></span>
        <button matButton="filled" matStepperNext type="button" [disabled]="what.invalid">
          {{ text.next }}
        </button>
      </div>
    </mat-step>

    <mat-step [label]="text.time">
      <div class="grid grid-cols-1 gap-x-4 pt-3 sm:grid-cols-[12rem_1fr]">
        <ui-text [label]="text.date" type="date" [control]="when.controls.date" />
        <ui-text [label]="text.reasonForVisit" [control]="when.controls.reason" />
      </div>
      <app-slot-picker
        class="mb-4"
        [providerId]="providerId()"
        [date]="date()"
        [type]="type()"
        [roomId]="roomId()"
        [(start)]="start"
      />
      @if (summary()) {
        <p class="m-0 mb-3 rounded-lg bg-surface-container px-3 py-2 text-sm">{{ summary() }}</p>
      }
      <div class="flex gap-2">
        <button matButton matStepperPrevious type="button">{{ text.back }}</button>
        <span class="flex-1"></span>
        <ui-button icon="event_available" [disabled]="!start()" [action]="book">{{
          text.book
        }}</ui-button>
      </div>
    </mat-step>
  </mat-stepper>
</mat-dialog-content>
