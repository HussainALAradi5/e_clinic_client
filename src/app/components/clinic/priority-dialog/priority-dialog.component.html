<h2 mat-dialog-title>{{ text.changePriority }} {{ data.treatment.code }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.changePriorityLabel"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-select
      [label]="text.priority"
      enum="TreatmentPriority"
      [required]="true"
      [control]="form.controls.priority"
    />
    <ui-text
      [label]="text.reason"
      [hint]="text.keptInTheHistory"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
