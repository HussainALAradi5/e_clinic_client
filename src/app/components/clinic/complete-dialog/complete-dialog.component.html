<h2 mat-dialog-title>{{ text.completeVisit }} {{ data.appointment.code }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.completeVisit"
    [allowPristine]="true"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <ui-entity-select
      [label]="text.addAServicePerformed"
      endpoint="billing/services"
      icon="add_shopping_cart"
      [display]="serviceName"
      [detail]="serviceCode"
      [control]="picker"
      (picked)="add($event)"
    />
    @if (extras().length) {
      <mat-chip-set class="mb-3 block" [attr.aria-label]="text.extraServices">
        @for (s of extras(); track s.id) {
          <mat-chip (removed)="removeExtra(s.id)"
            >{{ s.name
            }}<button matChipRemove [attr.aria-label]="text.remove + s.name">
              <mat-icon>cancel</mat-icon>
            </button></mat-chip
          >
        }
      </mat-chip-set>
    }
    <ui-select
      [label]="text.followUp"
      [hint]="text.suggestsADateTo"
      [options]="followUps"
      [control]="form.controls.followUpInDays"
    />
  </ui-form>
</mat-dialog-content>
