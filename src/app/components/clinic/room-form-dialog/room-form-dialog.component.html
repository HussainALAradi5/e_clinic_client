<h2 mat-dialog-title>{{ room ? text.editRoom : text.newRoom }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="room ? text.save : text.createRoom"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[9rem_1fr]">
      <ui-text [label]="text.code" [hint]="text.eGR101" [control]="form.controls.code" />
      <ui-text [label]="text.name" [control]="form.controls.name" />
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-3">
      <ui-select
        [label]="text.type"
        enum="RoomType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-text [label]="text.floor" [control]="form.controls.floor" />
      <ui-text [label]="text.capacity" type="number" [control]="form.controls.capacity" />
    </div>
    <ui-entity-select
      [label]="text.department"
      endpoint="hr/departments"
      [display]="departmentName"
      [initial]="$any(room?.department ?? null)"
      [control]="form.controls.departmentId"
    />
    <ui-text [label]="text.equipmentNotes" [multiline]="true" [control]="form.controls.notes" />
  </ui-form>
</mat-dialog-content>
