<h2 mat-dialog-title>{{ editing ? text.edit + editing.code : text.prescribeTreatment }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="editing ? text.save : text.prescribe"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      @if (!data.patient && !editing) {
        <ui-entity-select
          class="sm:col-span-2"
          [label]="text.patient"
          endpoint="patients"
          icon="person_search"
          [display]="patientName"
          [detail]="patientDetail"
          [control]="form.controls.patientId"
        />
      }
      <ui-text
        class="sm:col-span-2"
        [label]="text.treatment"
        [hint]="text.eGKneePhysiotherapy"
        [control]="form.controls.title"
      />
      <ui-select
        [label]="text.type"
        enum="TreatmentType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-select
        [label]="text.priority"
        enum="TreatmentPriority"
        [required]="true"
        [hint]="text.urgentFirstSessionWithin"
        [control]="form.controls.priority"
      />
      <ui-text
        [label]="text.plannedSessions"
        type="number"
        [control]="form.controls.plannedSessions"
      />
      <ui-text
        [label]="text.sessionLengthMin"
        type="number"
        [hint]="text.blankUsualLengthFor"
        [control]="form.controls.sessionDurationMinutes"
      />
      @if (!editing && !data.doctorId) {
        <ui-entity-select
          class="sm:col-span-2"
          [label]="text.responsibleDoctor"
          endpoint="doctors"
          icon="stethoscope"
          [display]="doctorName"
          [control]="form.controls.doctorId"
        />
      }
      <ui-entity-select
        class="sm:col-span-2"
        [label]="text.billedPerSessionOptional"
        endpoint="billing/services"
        [display]="serviceName"
        [filter]="procedures"
        [control]="form.controls.billableServiceId"
      />
      <ui-text
        class="sm:col-span-2"
        [label]="text.diagnosis"
        [multiline]="true"
        [rows]="2"
        [control]="form.controls.diagnosis"
      />
      <ui-text
        class="sm:col-span-2"
        [label]="text.planAndInstructions"
        [multiline]="true"
        [rows]="3"
        [control]="form.controls.plan"
      />
    </div>
  </ui-form>
</mat-dialog-content>
