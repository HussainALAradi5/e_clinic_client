<h2 mat-dialog-title>{{ labels.medicalHistory }} {{ data.patient.fullName }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <ui-text
      [label]="labels.allergies"
      [hint]="labels.shownAsARed"
      [control]="form.controls.allergies"
    />
    <ui-text
      [label]="labels.chronicConditions"
      [multiline]="true"
      [rows]="2"
      [control]="form.controls.chronicConditions"
    />
    <ui-text
      [label]="labels.familyHistory"
      [hint]="labels.eGFatherType"
      [multiline]="true"
      [rows]="3"
      [control]="form.controls.familyHistory"
    />
    <ui-text
      [label]="labels.surgicalHistory"
      [multiline]="true"
      [rows]="2"
      [control]="form.controls.surgicalHistory"
    />
  </ui-form>
</mat-dialog-content>
