<h2 mat-dialog-title>{{ referral ? 'Reply received' : 'Result' }} · {{ order.code }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ order.description }} · {{ order.patient?.fullName }}
  </p>
  <ui-upload-zone
    class="mb-4"
    [category]="category"
    [owner]="owner"
    (uploaded)="uploaded($event)"
  />
  @if (blocked()) {
    <p class="m-0 mb-3 text-sm text-on-surface-variant">
      Add at least one image before completing.
    </p>
  }
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="referral ? 'Close referral' : 'Complete'"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-text
      [label]="referral ? 'Summary of the reply' : 'Report / findings'"
      [multiline]="true"
      [rows]="5"
      [control]="form.controls.report"
    />
    @if (!referral) {
      <mat-checkbox class="-ml-2 block" [formControl]="form.controls.isAbnormal"
        >Abnormal result — alert the ordering doctor now</mat-checkbox
      >
    }
  </ui-form>
</mat-dialog-content>
