<h2 mat-dialog-title>{{ referral ? text.replyReceived : text.result }} · {{ order.code }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ order.description }} · {{ order.patient?.fullName }}
  </p>
  <ui-upload-zone
    class="mb-4"
    [category]="category"
    [owner]="owner"
    (uploaded)="uploaded($event)"
  />
  @if (blocked()) {
    <p class="m-0 mb-3 text-sm text-on-surface-variant">
      {{ text.addAtLeastOne }}
    </p>
  }
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="referral ? text.closeReferral : text.complete"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-text
      [label]="referral ? text.summaryOfTheReply : text.reportFindings"
      [multiline]="true"
      [rows]="5"
      [control]="form.controls.report"
    />
    @if (!referral) {
      <mat-checkbox class="-ml-2 block" [formControl]="form.controls.isAbnormal">{{
        text.abnormalResultAlertThe
      }}</mat-checkbox>
    }
  </ui-form>
</mat-dialog-content>
