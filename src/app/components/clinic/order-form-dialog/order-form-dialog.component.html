<h2 mat-dialog-title>{{ text.newOrder }} {{ data.patient.fullName }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="referral() ? text.writeReferral : text.order"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.typeOfOrder"
        enum="ClinicalOrderType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-select
        [label]="text.priority"
        enum="TreatmentPriority"
        [required]="true"
        [control]="form.controls.priority"
      />
      @if (referral()) {
        <div class="mb-4 sm:col-span-2">
          <p class="m-0 mb-2 text-sm text-on-surface-variant">{{ text.referTo }}</p>
          <mat-button-toggle-group
            hideSingleSelectionIndicator
            [attr.aria-label]="text.referTo"
            [formControl]="form.controls.target"
          >
            <mat-button-toggle value="specialty">{{ text.aSpecialty }}</mat-button-toggle>
            <mat-button-toggle value="doctor">{{ text.aDoctor }}</mat-button-toggle>
            <mat-button-toggle value="company">{{ text.anotherHospital }}</mat-button-toggle>
          </mat-button-toggle-group>
        </div>
        @switch (target()) {
          @case ('doctor') {
            <ui-entity-select
              class="sm:col-span-2"
              [label]="text.doctor"
              endpoint="doctors"
              icon="stethoscope"
              [display]="doctorName"
              [control]="form.controls.referredToDoctorId"
            />
          }
          @case ('company') {
            <ui-entity-select
              class="sm:col-span-2"
              [label]="text.hospital"
              endpoint="reference/companies"
              icon="local_hospital"
              [display]="companyName"
              [filter]="hospitals"
              [control]="form.controls.referredToCompanyId"
            />
          }
          @default {
            <ui-entity-select
              class="sm:col-span-2"
              [label]="text.specialty"
              endpoint="doctors/specialties"
              [display]="specialtyName"
              [control]="form.controls.referredToSpecialtyId"
            />
          }
        }
      } @else {
        <ui-entity-select
          class="sm:col-span-2"
          [label]="text.testOrExam"
          endpoint="billing/services"
          [hint]="text.billedWhenTheResult"
          [display]="serviceName"
          [filter]="services()"
          [control]="form.controls.billableServiceId"
        />
        <ui-text
          class="sm:col-span-2"
          [label]="text.bodyPartSample"
          [hint]="text.eGChestPa"
          [control]="form.controls.bodyPart"
        />
      }
      <ui-text
        class="sm:col-span-2"
        [label]="referral() ? text.reasonForReferral : text.clinicalQuestion"
        [multiline]="true"
        [rows]="3"
        [control]="form.controls.clinicalNotes"
      />
    </div>
  </ui-form>
</mat-dialog-content>
