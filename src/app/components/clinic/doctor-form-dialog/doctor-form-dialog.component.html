<h2 mat-dialog-title>{{ doctor ? text.editDoctorProfile : text.newDoctor }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="doctor ? text.save : text.createDoctor"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    @if (!doctor) {
      <ui-entity-select
        [label]="text.employee"
        endpoint="hr/employees"
        icon="badge"
        [hint]="text.hireThePersonIn"
        [display]="employeeName"
        [detail]="employeeDetail"
        [filter]="activeStaff"
        [control]="form.controls.employeeId"
      />
    }
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-entity-select
        [label]="text.specialty"
        endpoint="doctors/specialties"
        [display]="specialtyName"
        [initial]="$any(doctor?.specialty ?? null)"
        [control]="form.controls.specialtyId"
      />
      <ui-text [label]="text.title" [hint]="text.eGConsultant" [control]="form.controls.title" />
      <ui-text [label]="text.nhraLicenceNumber" [control]="form.controls.licenseNumber" />
      <ui-text
        [label]="text.licenceValidUntil"
        type="date"
        [control]="form.controls.licenseExpiryDate"
      />
      <ui-entity-select
        [label]="text.consultationFee"
        endpoint="billing/services"
        [display]="serviceName"
        [filter]="consultations"
        [initial]="$any(doctor?.consultationService ?? null)"
        [control]="form.controls.consultationServiceId"
      />
      <ui-entity-select
        [label]="text.followUpFee"
        endpoint="billing/services"
        [display]="serviceName"
        [filter]="consultations"
        [initial]="$any(doctor?.followUpService ?? null)"
        [control]="form.controls.followUpServiceId"
      />
      <ui-text
        [label]="text.slotLengthMinutes"
        type="number"
        [control]="form.controls.defaultSlotMinutes"
      />
      <ui-text
        [label]="text.dailyLimitOptional"
        type="number"
        [hint]="text.mostBookingsPerDay"
        [control]="form.controls.maxDailyAppointments"
      />
      <ui-entity-select
        class="sm:col-span-2"
        [label]="text.usualRoom"
        endpoint="rooms"
        [display]="roomName"
        [filter]="visitRooms"
        [initial]="$any(doctor?.defaultRoom ?? null)"
        [control]="form.controls.defaultRoomId"
      />
    </div>
    <ui-text
      [label]="text.shortBio"
      [hint]="text.shownToPatientsWhen"
      [multiline]="true"
      [control]="form.controls.bio"
    />
  </ui-form>
</mat-dialog-content>
