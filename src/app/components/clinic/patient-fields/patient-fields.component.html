@if (form().controls.allergies.enabled) {
  <h3 class="m-0 mb-2 text-sm font-semibold text-on-surface-variant">{{ text.medicalAlerts }}</h3>
  <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[10rem_1fr]">
    <ui-select
      [label]="text.bloodGroup"
      enum="BloodGroup"
      [required]="true"
      [control]="form().controls.bloodGroup"
    />
    <ui-text
      [label]="text.allergies"
      [hint]="text.shownAsARed"
      [control]="form().controls.allergies"
    />
  </div>
  <ui-text
    [label]="text.chronicConditions"
    [multiline]="true"
    [rows]="2"
    [control]="form().controls.chronicConditions"
  />
  <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
    <ui-text
      [label]="text.familyHistory"
      [hint]="text.eGFatherType"
      [multiline]="true"
      [rows]="2"
      [control]="form().controls.familyHistory"
    />
    <ui-text
      [label]="text.surgicalHistory"
      [multiline]="true"
      [rows]="2"
      [control]="form().controls.surgicalHistory"
    />
  </div>
}

<app-emergency-contacts-field [form]="form().controls.emergencyContacts" />

<h3 class="m-0 mb-2 text-sm font-semibold text-on-surface-variant">{{ text.insurance }}</h3>
<div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
  <ui-entity-select
    [label]="text.insurer"
    endpoint="reference/companies"
    [display]="companyName"
    [filter]="insurers"
    [initial]="$any(insurer())"
    [control]="form().controls.insuranceCompanyId"
  />
  <ui-text [label]="text.policyMemberNumber" [control]="form().controls.insurancePolicyNumber" />
  <ui-text [label]="text.validUntil" type="date" [control]="form().controls.insuranceExpiryDate" />
  <ui-text
    [label]="text.insurerPays"
    type="number"
    [hint]="text.eG80The"
    [control]="form().controls.insuranceCoveragePercent"
  />
</div>
<ui-text
  [label]="text.frontDeskNotes"
  [hint]="text.administrativeOnlyNoClinical"
  [multiline]="true"
  [rows]="2"
  [control]="form().controls.notes"
/>
