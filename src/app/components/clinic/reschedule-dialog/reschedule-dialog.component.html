<h2 mat-dialog-title>{{ text.reschedule }} {{ data.appointment.code }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ text.now }} {{ data.appointment.scheduledDate }} {{ text.at }}
    {{ data.appointment.startTime | clock }} {{ text.with }} {{ data.appointment.provider?.fullName
    }}{{ text.pickANewFree }}
  </p>
  <ui-text class="max-w-48" [label]="text.newDate" type="date" [control]="dateControl" />
  <app-slot-picker
    [providerId]="data.appointment.providerId"
    [date]="date()"
    [type]="data.appointment.type"
    [(start)]="start"
  />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="ref.close()">{{ text.close }}</button>
  <ui-button icon="update" [disabled]="!start()" [action]="move">{{
    text.moveAppointment
  }}</ui-button>
</mat-dialog-actions>
