<h2 mat-dialog-title>{{ text.openCashDrawer }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ text.countTheChangeYou }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.openDrawer"
    submitIcon="lock_open"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-money [label]="text.openingFloat" [control]="form.controls.openingFloat" />
  </ui-form>
</mat-dialog-content>
