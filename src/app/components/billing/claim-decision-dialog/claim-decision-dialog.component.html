<h2 mat-dialog-title>
  {{ text.insurersDecision }}
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ claim.code }} · {{ claim.insurer?.name }} {{ text.claimed }}
    {{ claim.claimedAmount | money }}</span
  >
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.recordDecision"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <mat-button-toggle-group
      class="mb-4"
      hideSingleSelectionIndicator
      [attr.aria-label]="text.decision"
      [formControl]="form.controls.approved"
    >
      <mat-button-toggle [value]="true">{{ text.approved }}</mat-button-toggle>
      <mat-button-toggle [value]="false">{{ text.rejected }}</mat-button-toggle>
    </mat-button-toggle-group>
    @if (form.controls.approved.value) {
      <ui-money
        [label]="text.approvedAmount"
        [hint]="text.lessThanClaimedWhen"
        [control]="form.controls.approvedAmount"
      />
      <ui-text [label]="text.insurersReference" [control]="form.controls.insurerReference" />
    } @else {
      <ui-text
        [label]="text.whyItWasRejected"
        [multiline]="true"
        [rows]="3"
        [control]="form.controls.rejectionReason"
      />
      <p class="m-0 mb-2 text-sm text-on-surface-variant">
        {{ text.thePatientKeepsThe }}
      </p>
    }
  </ui-form>
</mat-dialog-content>
