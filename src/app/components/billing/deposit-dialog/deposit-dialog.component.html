<h2 mat-dialog-title>
  {{ text.bankDeposit }}
  <span class="block text-sm font-normal text-on-surface-variant">{{ session.code }}</span>
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.recordDeposit"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text [label]="text.depositDate" type="date" [control]="form.controls.date" />
      <ui-money [label]="text.amount" [control]="form.controls.amount" />
    </div>
    <ui-text [label]="text.bankSlipReference" [control]="form.controls.reference" />
  </ui-form>
</mat-dialog-content>
