<h2 mat-dialog-title>
  {{ text.refund }}
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ payment.code }} · {{ payment.amount | money }} {{ text.by }}
    {{ payment.method | enumLabel: 'PaymentMethod' }} · {{ data.invoice.patient?.fullName }}</span
  >
</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ text.upTo }} {{ payment.refundable | money }} {{ text.canBeRefundedAnother }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.askForApproval"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-money [label]="text.amount" [control]="form.controls.amount" />
      <ui-select
        [label]="text.payBackBy"
        [options]="methods"
        [required]="true"
        [control]="form.controls.method"
      />
    </div>
    <ui-text
      [label]="text.reason"
      [multiline]="true"
      [rows]="3"
      [maxLength]="500"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
