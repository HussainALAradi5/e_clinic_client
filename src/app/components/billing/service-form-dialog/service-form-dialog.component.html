<h2 mat-dialog-title>{{ service ? text.editService : text.newService }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="service ? text.save : text.createService"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[11rem_1fr]">
      <ui-text [label]="text.code" [hint]="text.eGConsGp" [control]="form.controls.code" />
      <ui-text [label]="text.name" [control]="form.controls.name" />
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-3">
      <ui-select
        [label]="text.category"
        enum="ServiceCategory"
        [required]="true"
        [control]="form.controls.category"
      />
      <ui-money
        [label]="text.price"
        [hint]="service ? text.appliesToNewCharges : null"
        [control]="form.controls.price"
      />
      <ui-text
        [label]="text.vat"
        type="number"
        [hint]="text.n0ForZeroRated"
        [control]="form.controls.taxRate"
      />
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-entity-select
        [label]="text.revenueAccount"
        endpoint="accounting/accounts"
        [display]="accountName"
        [filter]="revenueAccounts"
        [initial]="$any(service?.revenueAccount ?? null)"
        [control]="form.controls.revenueAccountId"
      />
      <ui-entity-select
        [label]="text.specialtyOptional"
        endpoint="doctors/specialties"
        [display]="specialtyName"
        [initial]="$any(service?.specialty ?? null)"
        [control]="form.controls.specialtyId"
      />
      <ui-select
        [label]="text.signedConsentNeeded"
        enum="ConsentType"
        [control]="form.controls.consentType"
      />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="form.controls.isInsurable">{{
      text.canBeClaimedFrom
    }}</mat-checkbox>
  </ui-form>
</mat-dialog-content>
