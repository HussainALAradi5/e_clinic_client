<h2 mat-dialog-title>{{ text.editPersonalData }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [compact]="true"
    (saved)="ref.close(true)"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text
        [label]="text.firstName"
        [control]="form.controls.firstName"
        autocomplete="given-name"
      />
      <ui-text
        [label]="text.lastName"
        [control]="form.controls.lastName"
        autocomplete="family-name"
      />
      <ui-select
        [label]="text.gender"
        enum="Gender"
        [required]="true"
        [control]="form.controls.gender"
      />
      <ui-text [label]="text.dateOfBirth" type="date" [control]="form.controls.dateOfBirth" />
      <ui-text
        [label]="text.nationalIdPassport"
        [control]="form.controls.nationalId"
        [hint]="
          data.person.nationalId
            ? text.storedPrefix + data.person.nationalId + text.leaveBlankToKeep
            : null
        "
      />
      <ui-text
        [label]="text.mobile"
        type="tel"
        [hint]="text.internationalFormatEG"
        [control]="form.controls.phone"
      />
      <ui-text [label]="text.email" type="email" [control]="form.controls.email" />
      <ui-country-select
        [label]="text.nationality"
        mode="nationality"
        [control]="form.controls.nationalityCode"
      />
    </div>
    <ui-address-fields class="mt-2" [form]="form.controls.address" />
  </ui-form>
</mat-dialog-content>
