<h2 mat-dialog-title>{{ text.changeAccountStatus }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ data.user.fullName }} {{ text.lockingOrDeactivatingSigns }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.changeStatus"
    [compact]="true"
    (saved)="ref.close(true)"
    (cancelled)="ref.close()"
  >
    <ui-select
      [label]="text.newStatus"
      [control]="form.controls.status"
      [options]="options()"
      [required]="true"
    />
    @if (needsReason()) {
      <ui-text
        [label]="text.reason"
        [multiline]="true"
        [maxLength]="reasonMax"
        [control]="form.controls.reason"
      />
    }
  </ui-form>
</mat-dialog-content>
