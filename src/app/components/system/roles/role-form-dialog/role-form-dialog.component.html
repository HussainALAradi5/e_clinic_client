<h2 mat-dialog-title>{{ data.role ? text.editRole : text.newRole }}</h2>
<mat-dialog-content>
  @if (data.role?.isSystem) {
    <p class="mt-0 text-sm text-on-surface-variant">
      {{ text.systemRoleOnlyThe }}
    </p>
  }
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="data.role ? text.save : text.createRole"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <ui-text
      [label]="text.systemName"
      [hint]="text.lowerCaseNoSpaces"
      [control]="form.controls.name"
    />
    <ui-text [label]="text.name" [control]="form.controls.displayName" />
    <ui-text [label]="text.description" [multiline]="true" [control]="form.controls.description" />
  </ui-form>
</mat-dialog-content>
