<h2 mat-dialog-title>
  <ui-flag [code]="data.country.code" /> {{ data.country.name }} ({{ data.country.code }})
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text [label]="text.name" [control]="form.controls.name" />
      <ui-text [label]="text.nationality" [control]="form.controls.nationality" />
      <ui-text [label]="text.dialCode" [hint]="text.eG973" [control]="form.controls.phoneCode" />
      <ui-text
        [label]="text.orderInPickers"
        type="number"
        [hint]="text.lowerComesFirst"
        [control]="form.controls.sortOrder"
      />
    </div>
    <mat-slide-toggle [formControl]="form.controls.isActive">{{
      text.shownInPickers
    }}</mat-slide-toggle>
    <p class="mb-0 mt-1 text-xs text-on-surface-variant">
      {{ text.hidingACountryKeeps }}
    </p>
  </ui-form>
</mat-dialog-content>
