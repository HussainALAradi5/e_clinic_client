<h2 mat-dialog-title>{{ data.company ? text.editCompany : text.newCompany }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="data.company ? text.save : text.createCompany"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.type"
        enum="CompanyType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-country-select [label]="text.country" [control]="form.controls.countryCode" />
      <ui-text [label]="text.name" [control]="form.controls.name" />
      <ui-text [label]="text.contactPerson" [control]="form.controls.contactPerson" />
      <ui-text [label]="text.phone" type="tel" [control]="form.controls.phone" />
      <ui-text [label]="text.email" type="email" [control]="form.controls.email" />
      <ui-text [label]="text.website" [hint]="text.https" [control]="form.controls.website" />
      <ui-text [label]="text.vatNumber" [control]="form.controls.vatNumber" />
      <ui-text [label]="text.commercialRegistration" [control]="form.controls.crNumber" />
      <ui-text
        class="sm:col-span-2"
        [label]="text.description"
        [multiline]="true"
        [control]="form.controls.description"
      />
    </div>
    <ui-address-fields class="mt-2" [form]="form.controls.address" />
  </ui-form>
</mat-dialog-content>
