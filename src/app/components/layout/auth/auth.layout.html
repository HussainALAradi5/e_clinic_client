<div class="grid min-h-dvh lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
  <ui-brand-surface mark="field" class="hidden flex-col justify-between p-12 lg:flex">
    <a routerLink="/" class="w-fit no-underline" [attr.aria-label]="text.eClinicWebsite">
      <ui-brand-mark tone="light" size="lg" />
    </a>

    <div class="max-w-lg">
      <p class="m-0 text-4xl leading-tight font-bold tracking-tight text-white xl:text-5xl">
        {{ text.yourClinicFromThe }}
      </p>
      <p class="mt-5 mb-0 max-w-md text-base leading-relaxed text-white/70">
        {{ text.staffSignInTo }}
      </p>

      <ul class="m-0 mt-10 flex list-none flex-col gap-3 p-0" [attr.aria-label]="text.whatYouCanDo">
        @for (item of highlights; track item.title) {
          <li class="glass-card">
            <span
              class="grid size-10 shrink-0 place-items-center rounded-xl bg-pine-100 text-pine-900"
            >
              <mat-icon>{{ item.icon }}</mat-icon>
            </span>
            <span class="min-w-0">
              <span class="block font-semibold text-white">{{ item.title }}</span>
              <span class="block truncate text-sm text-white/65">{{ item.detail }}</span>
            </span>
          </li>
        }
      </ul>
    </div>

    <p class="m-0 text-sm text-white/55">
      {{ clinic.addressLines.join(', ') }}, {{ clinic.phone }}
    </p>
  </ui-brand-surface>

  <div class="auth-form-side flex flex-col">
    <header class="flex items-center justify-between px-6 pt-6 sm:px-10">
      <a routerLink="/" class="no-underline lg:invisible" [attr.aria-label]="text.eClinicWebsite">
        <ui-brand-mark />
      </a>
      <a
        routerLink="/"
        class="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-on-surface-variant no-underline hover:bg-surface-container hover:text-on-surface"
      >
        <mat-icon class="!size-5 !text-xl">arrow_back</mat-icon>
        {{ text.backToWebsite }}
      </a>
    </header>

    <main class="flex flex-1 items-center justify-center px-6 py-10 sm:px-10">
      <div class="w-full max-w-[25rem]">
        <router-outlet />
      </div>
    </main>

    <p class="m-0 px-6 pb-6 text-center text-xs text-on-surface-variant sm:px-10">
      {{ clinic.emergencyNote }}
    </p>
  </div>
</div>
