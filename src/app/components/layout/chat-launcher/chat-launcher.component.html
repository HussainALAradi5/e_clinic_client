<a
  matIconButton
  tapMotion="bounce"
  [routerLink]="path"
  [matTooltip]="unread() ? unread() + ' unread messages' : 'Chat'"
  aria-label="Chat"
  [matBadge]="badge()"
  [matBadgeHidden]="!unread()"
  [matBadgeSize]="settings().countInBadge ? 'medium' : 'small'"
  matBadgeColor="primary"
>
  <mat-icon>chat</mat-icon>
</a>
