<a
  matIconButton
  tapMotion="bounce"
  [routerLink]="path"
  [matTooltip]="unread() ? unread() + text.unreadMessages : text.chat"
  [attr.aria-label]="text.chat"
  [matBadge]="badge()"
  [matBadgeHidden]="!unread()"
  [matBadgeSize]="settings().countInBadge ? 'medium' : 'small'"
  matBadgeColor="primary"
>
  <mat-icon>chat</mat-icon>
</a>
