@if (inboxLink(); as link) {
  <a
    matIconButton
    tapMotion="ring"
    aria-label="Notifications"
    matTooltip="Notifications"
    [routerLink]="link"
  >
    <ng-container [ngTemplateOutlet]="icon" />
  </a>
} @else {
  <button
    matIconButton
    tapMotion="ring"
    aria-label="Notifications"
    matTooltip="Notifications"
    [matMenuTriggerFor]="inbox"
    (menuOpened)="load()"
  >
    <ng-container [ngTemplateOutlet]="icon" />
  </button>
}
<ng-template #icon>
  <mat-icon
    [matBadge]="unread() > 99 ? '99+' : unread()"
    [matBadgeHidden]="unread() === 0"
    matBadgeSize="small"
    matBadgeColor="warn"
    aria-hidden="false"
    >notifications</mat-icon
  >
</ng-template>
<mat-menu #inbox="matMenu" xPosition="before" class="!max-w-sm">
  <div
    class="flex items-center justify-between px-4 py-2"
    (click)="$event.stopPropagation()"
    role="presentation"
  >
    <span class="font-semibold">Notifications</span>
    @if (unread() > 0) {
      <button matButton (click)="markAllRead($event)">Mark all read</button>
    }
  </div>
  @for (item of items(); track item.id) {
    <button
      mat-menu-item
      class="!h-auto !py-2"
      [class.notice-unread]="!item.readAt"
      (click)="open(item)"
    >
      <div class="flex flex-col whitespace-normal">
        <span class="flex items-center gap-2 text-sm" [class.font-semibold]="!item.readAt">
          @if (!item.readAt) {
            <span
              class="inline-block size-2 shrink-0 rounded-full bg-primary"
              aria-label="Unread"
            ></span>
          }
          {{ item.subject ?? item.body }}
        </span>
        @if (item.subject) {
          <span class="text-xs text-on-surface-variant">{{ item.body }}</span>
        }
        <span class="text-xs text-on-surface-variant">{{ item.createdAt | relativeTime }}</span>
      </div>
    </button>
  } @empty {
    <p class="m-0 px-4 py-3 text-sm text-on-surface-variant">
      {{ loading() ? 'Loading…' : 'You are all caught up.' }}
    </p>
  }
  <a
    mat-menu-item
    routerLink="/notifications"
    class="!justify-center !text-sm !font-medium !text-primary"
    >See all notifications</a
  >
</mat-menu>
