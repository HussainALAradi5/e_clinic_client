<h2 mat-dialog-title>{{ text.contactDetails }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.saveDetails"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid gap-x-4 sm:grid-cols-2">
      <ui-text [label]="text.mobile" type="tel" icon="call" [control]="form.controls.phone" />
      <ui-text
        [label]="text.email"
        type="email"
        icon="mail"
        [hint]="text.youSignInWith"
        [control]="form.controls.email"
      />
    </div>
    <ui-address-fields [form]="form.controls.address" />
    <app-emergency-contacts-field class="mt-2" [form]="form.controls.emergencyContacts" />
  </ui-form>
</mat-dialog-content>
