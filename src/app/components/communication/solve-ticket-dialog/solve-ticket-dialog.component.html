<h2 mat-dialog-title class="flex items-center gap-2">
  <mat-icon>task_alt</mat-icon>{{ text.mark }} {{ data.code }} {{ text.solved }}
</h2>
<mat-dialog-content>
  <p class="mt-0 mb-4 text-sm text-on-surface-variant">
    {{ data.requester }} {{ text.seesWhatYouWrite }}
  </p>
  <label class="field">
    <span>{{ text.solution }} <b aria-hidden="true">*</b></span>
    <textarea
      rows="4"
      maxlength="1000"
      required
      [attr.aria-label]="text.solution"
      [placeholder]="text.whatWasWrongAnd"
      [ngModel]="resolution()"
      (ngModelChange)="resolution.set($event)"
    ></textarea>
    <small>{{ resolution().length }} / 1000</small>
  </label>

  <p class="mt-4 mb-2 text-sm font-medium">
    {{ text.steps }}
    <span class="font-normal text-on-surface-variant">{{ text.optionalForAStep }}</span>
  </p>
  <ol class="steps">
    @for (step of steps(); track $index; let i = $index; let last = $last) {
      <li>
        <span class="num">{{ i + 1 }}</span>
        <input
          [attr.aria-label]="text.step + (i + 1)"
          [placeholder]="i === 0 ? text.eGCleanedThe : text.nextStep"
          maxlength="500"
          [ngModel]="step"
          (ngModelChange)="set(i, $event)"
          (keydown.enter)="$event.preventDefault(); add(i)"
        />
        <button
          matIconButton
          type="button"
          [matTooltip]="text.moveUp"
          [attr.aria-label]="text.moveUp"
          [disabled]="i === 0"
          (click)="move(i, -1)"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>
        <button
          matIconButton
          type="button"
          [matTooltip]="text.moveDown"
          [attr.aria-label]="text.moveDown"
          [disabled]="last"
          (click)="move(i, 1)"
        >
          <mat-icon>arrow_downward</mat-icon>
        </button>
        <button
          matIconButton
          type="button"
          [matTooltip]="text.removeStep"
          [attr.aria-label]="text.removeStep"
          [disabled]="steps().length === 1"
          (click)="remove(i)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </li>
    }
  </ol>
  <button
    matButton
    type="button"
    [disabled]="steps().length >= max"
    (click)="add(steps().length - 1)"
  >
    <mat-icon>add</mat-icon> {{ text.addAStep }}
  </button>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>{{ text.cancel }}</button>
  <button matButton="filled" [disabled]="!resolution().trim()" (click)="done()">
    <mat-icon>task_alt</mat-icon> {{ label() }}
  </button>
</mat-dialog-actions>
