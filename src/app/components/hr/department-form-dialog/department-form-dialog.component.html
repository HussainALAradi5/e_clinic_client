<h2 mat-dialog-title>{{ department ? text.editDepartment : text.newDepartment }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="department ? text.save : text.createDepartment"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[10rem_1fr]">
      <ui-text [label]="text.code" [hint]="text.eGPhysio" [control]="form.controls.code" />
      <ui-text [label]="text.name" [control]="form.controls.name" />
    </div>
    <ui-entity-select
      [label]="text.partOf"
      endpoint="hr/departments"
      [hint]="text.emptyTopLevel"
      [display]="departmentName"
      [detail]="departmentCode"
      [filter]="notSelf"
      [initial]="$any(parent)"
      [control]="form.controls.parentId"
    />
    <ui-entity-select
      [label]="text.manager"
      endpoint="hr/employees"
      [display]="employeeName"
      [detail]="employeeTitle"
      [filter]="activeOnly"
      [initial]="$any(manager)"
      [control]="form.controls.managerId"
    />
    <ui-text
      [label]="text.costCenter"
      [hint]="text.tagsSalaryPostings"
      [control]="form.controls.costCenterCode"
    />
  </ui-form>
</mat-dialog-content>
