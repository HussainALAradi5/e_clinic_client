<h2 mat-dialog-title>{{ text.addAllowanceOrDeduction }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.add"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.allowanceOrDeduction"
        enum="SalaryComponentType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-text
        [label]="text.name"
        [hint]="text.eGHousingAllowance"
        [control]="form.controls.name"
      />
      <ui-money [label]="text.monthlyAmount" [control]="form.controls.amount" />
      <span></span>
      <ui-text [label]="text.from" type="date" [control]="form.controls.effectiveFrom" />
      <ui-text [label]="text.untilOptional" type="date" [control]="form.controls.effectiveTo" />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="form.controls.isTaxable">{{
      text.countsTowardSocialInsurance
    }}</mat-checkbox>
  </ui-form>
</mat-dialog-content>
