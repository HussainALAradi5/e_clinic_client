<div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
  <ui-entity-select
    [label]="text.department"
    endpoint="hr/departments"
    [display]="departmentName"
    [initial]="$any(department())"
    [control]="form().controls.departmentId"
  />
  <ui-text [label]="text.jobTitle" [control]="form().controls.jobTitle" />
  <ui-select
    [label]="text.contract"
    enum="EmploymentType"
    [required]="true"
    [control]="form().controls.employmentType"
  />
  <ui-text [label]="text.hireDate" type="date" [control]="form().controls.hireDate" />
  <ui-text [label]="text.probationEnds" type="date" [control]="form().controls.probationEndDate" />
  <ui-select
    [label]="text.weeklyDaysOff"
    [multiple]="true"
    [options]="days"
    [control]="form().controls.weeklyOffDays"
  />
  <ui-text [label]="text.shiftStarts" type="time" [control]="form().controls.workStartTime" />
  <ui-text [label]="text.shiftEnds" type="time" [control]="form().controls.workEndTime" />
</div>
@if (salary()) {
  <h3 class="m-0 mb-2 mt-1 text-sm font-semibold text-on-surface-variant">{{ text.salary }}</h3>
  <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
    <ui-money [label]="text.basicSalaryMonthly" [control]="form().controls.basicSalary" />
    <ui-text [label]="text.bank" [control]="form().controls.bankName" />
    <ui-text
      [label]="text.iban"
      [hint]="
        storedIban()
          ? text.storedPrefix + storedIban() + text.leaveBlankToKeep
          : text.bh20Characters
      "
      [control]="form().controls.iban"
    />
    <ui-text
      [label]="text.socialInsuranceGosiNumber"
      [control]="form().controls.socialInsuranceNumber"
    />
  </div>
}
