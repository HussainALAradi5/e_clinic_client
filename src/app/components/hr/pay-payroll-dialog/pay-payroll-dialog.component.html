<h2 mat-dialog-title>
  {{ text.salariesPaid }} {{ data.run.totalNet | money }}
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ data.run.code }} · {{ data.run.employeeCount }} {{ text.employees }}</span
  >
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.markAsPaid"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-text [label]="text.transferredOn" type="date" [control]="form.controls.paidOn" />
    <ui-text
      [label]="text.bankWpsFileReference"
      [hint]="text.optionalPrintedOnThe"
      [control]="form.controls.reference"
    />
    <p class="m-0 text-sm text-on-surface-variant">
      {{ text.everyEmployeeIsTold }}
    </p>
  </ui-form>
</mat-dialog-content>
