<h2 mat-dialog-title>{{ data.type ? text.edit + data.type.name : text.newLeaveType }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [compact]="true"
    [allowPristine]="!data.type"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[10rem_minmax(0,1fr)]">
      <ui-text [label]="text.code" [hint]="text.eGAnnual" [control]="form.controls.code" />
      <ui-text [label]="text.name" [control]="form.controls.name" />
    </div>
    <ui-text [label]="text.arabicName" [control]="form.controls.nameAr" />
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-3">
      <ui-text
        [label]="text.daysAYear"
        type="number"
        [hint]="text.n0NoLimit"
        [control]="form.controls.annualQuotaDays"
      />
      <ui-text
        [label]="text.carryToNextYear"
        type="number"
        [control]="form.controls.maxCarryForwardDays"
      />
      <ui-text [label]="text.noticeDays" type="number" [control]="form.controls.minNoticeDays" />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="form.controls.isPaid">{{
      text.paidUnpaidDaysAre
    }}</mat-checkbox>
    <mat-checkbox class="-ml-2 block" [formControl]="form.controls.requiresAttachment">{{
      text.needsACertificate
    }}</mat-checkbox>
  </ui-form>
</mat-dialog-content>
