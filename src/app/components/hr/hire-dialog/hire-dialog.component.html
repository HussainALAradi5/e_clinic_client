<h2 mat-dialog-title>Hire employee</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Hire"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <h3 class="m-0 mb-2 text-sm font-semibold text-on-surface-variant">Person</h3>
    <mat-button-toggle-group
      class="mb-3"
      hideSingleSelectionIndicator
      [value]="mode()"
      (change)="setMode($event.value)"
      aria-label="Person"
    >
      <mat-button-toggle value="new">New person</mat-button-toggle>
      <mat-button-toggle value="existing">Already on file</mat-button-toggle>
    </mat-button-toggle-group>
    @if (isNew()) {
      <ui-person-fields [form]="person" />
    } @else {
      <ui-entity-select
        label="Person"
        endpoint="people"
        icon="person_search"
        hint="Search by name, file number or mobile — e.g. a patient joining the staff"
        [display]="personName"
        [detail]="personDetail"
        [control]="existing"
      />
    }

    <h3 class="m-0 mb-2 mt-2 text-sm font-semibold text-on-surface-variant">Employment</h3>
    <app-employment-fields [form]="employment" />

    <h3 class="m-0 mb-2 mt-2 text-sm font-semibold text-on-surface-variant">Account</h3>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        label="Account type"
        [required]="true"
        [options]="userTypes"
        [control]="account.controls.userType"
      />
      <ui-select
        label="Roles"
        [multiple]="true"
        [options]="roles"
        [control]="account.controls.roles"
      />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="account.controls.canLogin">
      Signs in to e-Clinic — an email with a link to set the password is sent
    </mat-checkbox>
  </ui-form>
</mat-dialog-content>
