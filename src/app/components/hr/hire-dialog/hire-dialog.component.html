<h2 mat-dialog-title>{{ text.hireEmployee }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.hire"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <h3 class="m-0 mb-2 text-sm font-semibold text-on-surface-variant">{{ text.person }}</h3>
    <mat-button-toggle-group
      class="mb-3"
      hideSingleSelectionIndicator
      [value]="mode()"
      (change)="setMode($event.value)"
      [attr.aria-label]="text.person"
    >
      <mat-button-toggle value="new">{{ text.newPerson }}</mat-button-toggle>
      <mat-button-toggle value="existing">{{ text.alreadyOnFile }}</mat-button-toggle>
    </mat-button-toggle-group>
    @if (isNew()) {
      <ui-person-fields [form]="person" />
    } @else {
      <ui-entity-select
        [label]="text.person"
        endpoint="people"
        icon="person_search"
        [hint]="text.searchByNameFile"
        [display]="personName"
        [detail]="personDetail"
        [control]="existing"
      />
    }

    <h3 class="m-0 mb-2 mt-2 text-sm font-semibold text-on-surface-variant">
      {{ text.employment }}
    </h3>
    <app-employment-fields [form]="employment" />

    <h3 class="m-0 mb-2 mt-2 text-sm font-semibold text-on-surface-variant">{{ text.account }}</h3>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.accountType"
        [required]="true"
        [options]="userTypes"
        [control]="account.controls.userType"
      />
      <ui-select
        [label]="text.roles"
        [multiple]="true"
        [options]="roles"
        [control]="account.controls.roles"
      />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="account.controls.canLogin">
      {{ text.signsInToE }}
    </mat-checkbox>
  </ui-form>
</mat-dialog-content>
