<h2 mat-dialog-title>{{ shift ? text.edit + shift.code : text.newShift }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="shift ? text.save : text.createShift"
    [compact]="true"
    [allowPristine]="!shift"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <ui-text [label]="text.name" [hint]="text.eGMorningEvening" [control]="form.controls.name" />

    <mat-button-toggle-group
      class="mb-4 w-full"
      hideSingleSelectionIndicator
      [attr.aria-label]="text.kindOfShift"
      [formControl]="form.controls.type"
    >
      <mat-button-toggle class="flex-1" [value]="types.Fixed">
        <mat-icon>schedule</mat-icon> {{ text.fixedHours }}
      </mat-button-toggle>
      <mat-button-toggle class="flex-1" [value]="types.Flexible">
        <mat-icon>more_time</mat-icon> {{ text.flexible }}
      </mat-button-toggle>
    </mat-button-toggle-group>

    <div class="grid grid-cols-2 gap-x-4">
      <ui-text
        [label]="flexible() ? text.earliestIn : text.starts"
        type="time"
        [control]="form.controls.startTime"
      />
      <ui-text
        [label]="flexible() ? text.latestOut : text.ends"
        type="time"
        [control]="form.controls.endTime"
      />
      @if (flexible()) {
        <ui-text
          [label]="text.arriveBy"
          type="time"
          [hint]="text.lateAfterThis"
          [control]="form.controls.latestStart"
        />
        <ui-text
          [label]="text.hoursADay"
          type="number"
          [hint]="text.overtimeIsBeyondThis"
          [control]="form.controls.hours"
        />
      }
    </div>

    <p
      class="m-0 mb-3 flex items-start gap-2 rounded-xl bg-surface-container px-3 py-2 text-sm text-on-surface-variant"
    >
      <mat-icon class="!size-5 !text-xl" aria-hidden="true">info</mat-icon>
      <span>{{ summary() }}</span>
    </p>

    <ui-text [label]="text.notes" [multiline]="true" [rows]="2" [control]="form.controls.notes" />
  </ui-form>
</mat-dialog-content>
