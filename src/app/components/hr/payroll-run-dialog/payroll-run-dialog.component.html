<h2 mat-dialog-title>{{ text.newPayroll }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.create"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-select
      [label]="text.month"
      [options]="months"
      [required]="true"
      [control]="form.controls.month"
    />
    <p class="m-0 text-sm text-on-surface-variant">
      {{ text.salariesAllowancesAndDeductions }}
    </p>
  </ui-form>
</mat-dialog-content>
