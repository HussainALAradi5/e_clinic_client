<h2 mat-dialog-title>
  {{ text.correctAttendance }}
  @if (data.employee) {
    <span class="block text-sm font-normal text-on-surface-variant">{{
      data.employee.fullName
    }}</span>
  }
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.saveDay"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    @if (!data.employee) {
      <ui-entity-select
        [label]="text.employee"
        endpoint="hr/employees"
        icon="badge"
        [display]="employeeName"
        [detail]="employeeTitle"
        [filter]="activeOnly"
        [control]="form.controls.employeeId"
      />
    }
    <ui-text [label]="text.day" type="date" [control]="form.controls.date" />
    <mat-button-toggle-group
      class="mb-4"
      hideSingleSelectionIndicator
      [attr.aria-label]="text.whatToRecord"
      [formControl]="form.controls.mode"
    >
      <mat-button-toggle value="times">{{ text.timesWorked }}</mat-button-toggle>
      <mat-button-toggle value="day">{{ text.dayNotWorked }}</mat-button-toggle>
    </mat-button-toggle-group>
    @if (mode() === 'times') {
      <div class="grid grid-cols-2 gap-x-4">
        <ui-text [label]="text.checkedIn" type="time" [control]="form.controls.checkIn" />
        <ui-text [label]="text.checkedOut" type="time" [control]="form.controls.checkOut" />
      </div>
    } @else {
      <ui-select
        [label]="text.theDayWas"
        [options]="dayResults"
        [required]="true"
        [control]="form.controls.status"
      />
    }
    <ui-text
      [label]="text.reason"
      [hint]="text.keptInTheHistory"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
