<nav
  class="flex flex-wrap items-center justify-end gap-x-4 gap-y-2 py-2 text-sm text-on-surface-variant"
  [attr.aria-label]="text.pagination"
>
  <label class="flex items-center gap-2">
    {{ text.rows }}
    <mat-select
      class="w-16"
      [value]="meta().perPage"
      (selectionChange)="change({ page: 1, perPage: $event.value })"
      [aria-label]="text.rowsPerPage"
    >
      @for (size of pageSizes(); track size) {
        <mat-option [value]="size">{{ size }}</mat-option>
      }
    </mat-select>
  </label>

  @if (cursorMode()) {
    <span class="flex items-center">
      <button
        matIconButton
        [disabled]="!meta().prevCursor"
        (click)="change({ perPage: meta().perPage, cursor: meta().prevCursor! })"
        [matTooltip]="text.previous"
        [attr.aria-label]="text.previousPage"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        matIconButton
        [disabled]="!meta().nextCursor"
        (click)="change({ perPage: meta().perPage, cursor: meta().nextCursor! })"
        [matTooltip]="text.next"
        [attr.aria-label]="text.nextPage"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
    </span>
  } @else {
    <span class="tabular-nums" aria-live="polite">{{ range() }}</span>
    <label class="hidden items-center gap-2 md:flex">
      {{ text.page }}
      <input
        class="w-14 rounded-md border border-outline-variant bg-transparent px-2 py-1 text-on-surface tabular-nums"
        type="number"
        min="1"
        [max]="lastPage()"
        [value]="page()"
        (change)="jump($event)"
        [attr.aria-label]="text.goToPage"
      />
      {{ text.of }} {{ lastPage() }}
    </label>
    <span class="flex items-center">
      <button
        matIconButton
        [disabled]="page() <= 1"
        (click)="go(1)"
        [attr.aria-label]="text.firstPage"
      >
        <mat-icon>first_page</mat-icon>
      </button>
      <button
        matIconButton
        [disabled]="page() <= 1"
        (click)="go(page() - 1)"
        [matTooltip]="text.previous"
        [attr.aria-label]="text.previousPage"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        matIconButton
        [disabled]="page() >= lastPage()"
        (click)="go(page() + 1)"
        [matTooltip]="text.next"
        [attr.aria-label]="text.nextPage"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button
        matIconButton
        [disabled]="page() >= lastPage()"
        (click)="go(lastPage())"
        [attr.aria-label]="text.lastPage"
      >
        <mat-icon>last_page</mat-icon>
      </button>
    </span>
  }
</nav>
