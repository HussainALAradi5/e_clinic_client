<mat-form-field class="w-full">
  <mat-label>{{ label() }}</mat-label>
  @if (control().value; as code) {
    <ui-flag matTextPrefix class="mr-2" [code]="code" />
  }
  <input
    matInput
    [formControl]="search"
    [matAutocomplete]="auto"
    (blur)="blur()"
    autocomplete="off"
    spellcheck="false"
  />
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="nameOf"
    (optionSelected)="select($event.option.value)"
  >
    @for (country of matches(); track country.code) {
      <mat-option [value]="country.code">
        <ui-flag class="mr-2" [code]="country.code" />
        {{ display(country) }}
      </mat-option>
    } @empty {
      <mat-option disabled>{{ text.noCountryMatches }}</mat-option>
    }
  </mat-autocomplete>
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (control().invalid && control().touched) {
    <mat-error>{{ error() }}</mat-error>
  }
</mat-form-field>
