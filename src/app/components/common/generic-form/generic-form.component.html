<form [formGroup]="form()" (ngSubmit)="requestSubmit()" novalidate class="flex flex-col gap-6">
  <ng-content />
  <!-- Browsers submit on Enter only when the form has a submit button; ui-button below stays type="button". -->
  <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true"></button>
  <footer
    class="flex justify-end gap-2"
    [class]="
      compact() || block()
        ? 'pt-1'
        : 'sticky bottom-0 z-10 -mx-4 border-t border-outline-variant bg-surface px-4 py-3'
    "
  >
    @if (cancelLabel()) {
      <button matButton type="button" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
    }
    <ui-button
      [action]="run"
      [lock]="lock()"
      [silentErrors]="true"
      [disabled]="form().pristine && !allowPristine()"
      [block]="block()"
      [icon]="submitIcon()"
      [access]="access()"
      (failed)="onFailed($event)"
    >
      {{ submitLabel() }}
    </ui-button>
  </footer>
</form>
