<fieldset class="m-0 grid grid-cols-1 gap-x-4 border-0 p-0 sm:grid-cols-2">
  <legend class="mb-2 p-0 text-sm font-medium text-on-surface-variant">{{ text.address }}</legend>
  <ui-country-select
    class="sm:col-span-2"
    [label]="text.country"
    [control]="form().controls.countryCode"
  />
  @if (bahrain()) {
    <ui-text [label]="text.flatOffice" [control]="form().controls.flat" />
    <ui-text [label]="text.building" [control]="form().controls.building" />
    <ui-text [label]="text.road" [control]="form().controls.road" />
    <ui-text [label]="text.block" [control]="form().controls.block" />
    <ui-text
      class="sm:col-span-2"
      [label]="text.area"
      [hint]="text.eGSeefJuffair"
      [control]="form().controls.area"
    />
  } @else {
    <ui-text
      class="sm:col-span-2"
      [label]="text.addressLine1"
      [control]="form().controls.line1"
      autocomplete="address-line1"
    />
    <ui-text
      class="sm:col-span-2"
      [label]="text.addressLine2"
      [control]="form().controls.line2"
      autocomplete="address-line2"
    />
    <ui-text [label]="text.city" [control]="form().controls.city" autocomplete="address-level2" />
    <ui-text
      [label]="text.postalCode"
      [control]="form().controls.postalCode"
      autocomplete="postal-code"
    />
    <ui-text
      class="sm:col-span-2"
      [label]="text.stateGovernorate"
      [control]="form().controls.governorate"
    />
  }
</fieldset>
