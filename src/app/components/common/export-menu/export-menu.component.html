<button
  matButton="outlined"
  type="button"
  [matMenuTriggerFor]="menu"
  [disabled]="busy()"
  [attr.aria-busy]="busy()"
>
  @if (busy()) {
    <mat-progress-spinner matButtonIcon diameter="18" mode="indeterminate" />
  } @else {
    <mat-icon>download</mat-icon>
  }
  {{ label() }}
</button>
<mat-menu #menu="matMenu" xPosition="before">
  <p class="m-0 px-4 pt-2 pb-1 text-xs text-on-surface-variant">
    {{ selectedCount() > 0 ? text.theSelectedRowsVisible : text.allRowsMatchingThe }}
  </p>
  @for (option of options(); track option.format) {
    <button mat-menu-item type="button" (click)="choose(option.format)">
      <mat-icon>{{ option.icon }}</mat-icon>
      <span>{{ option.label }}</span>
    </button>
  }
</mat-menu>
