<header class="flex flex-wrap items-center gap-3 pb-4">
  <!-- At least 16rem wide, so on a phone the actions wrap below instead of squeezing the title. -->
  <div class="min-w-[min(100%,16rem)] flex-1">
    <div class="flex items-center gap-3">
      <h1 class="m-0 truncate text-2xl font-semibold tracking-tight text-on-surface">
        {{ title() }}
      </h1>
      <ng-content select="[status]" />
    </div>
    @if (subtitle()) {
      <p class="m-0 mt-1 text-sm text-on-surface-variant">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content select="[actions]" />
    <ng-content />
  </div>
</header>
