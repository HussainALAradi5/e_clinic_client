<mat-form-field class="w-full">
  <mat-label>{{ label() }}</mat-label>
  <span matTextPrefix class="pe-1 text-on-surface-variant">{{ currency() }}{{ text.text }}</span>
  <input
    matInput
    class="tabular-nums"
    inputmode="decimal"
    [formControl]="control()"
    (blur)="normalise()"
  />
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  <mat-error>{{ error() }}</mat-error>
</mat-form-field>
