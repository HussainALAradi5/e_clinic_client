<h2 mat-dialog-title>{{ text.saveView }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ text.savesTheCurrentFilters }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.saveView"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <ui-text [label]="text.name" [control]="form.controls.name" />
    <mat-checkbox [formControl]="form.controls.isDefault">{{ text.openThisViewBy }}</mat-checkbox>
    @if (data.canShare) {
      <mat-checkbox [formControl]="form.controls.isShared">{{
        text.shareWithEveryoneWho
      }}</mat-checkbox>
    }
  </ui-form>
</mat-dialog-content>
