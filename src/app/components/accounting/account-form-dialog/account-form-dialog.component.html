<h2 mat-dialog-title>{{ account ? text.editAccount : text.newAccount }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="account ? text.save : text.createAccount"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[10rem_1fr]">
      @if (!account) {
        <ui-text [label]="text.code" [hint]="text.n310DigitsE" [control]="form.controls.code" />
      } @else {
        <ui-text
          [label]="text.code"
          [control]="form.controls.code"
          [hint]="text.theCodeNeverChanges"
        />
      }
      <ui-text [label]="text.name" [control]="form.controls.name" />
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select
        [label]="text.type"
        enum="AccountType"
        [required]="true"
        [control]="form.controls.type"
      />
      <ui-entity-select
        [label]="text.parentGroup"
        endpoint="accounting/accounts"
        [hint]="text.emptyTopLevel"
        [display]="accountName"
        [filter]="parentFilter()"
        [initial]="$any(parent)"
        [control]="form.controls.parentId"
      />
    </div>
    @if (!account) {
      <mat-checkbox class="-ml-2 mb-2 block" [formControl]="form.controls.isGroup">
        {{ text.groupAccountHoldsOther }}
      </mat-checkbox>
    }
    <ui-text [label]="text.description" [multiline]="true" [control]="form.controls.description" />
  </ui-form>
</mat-dialog-content>
