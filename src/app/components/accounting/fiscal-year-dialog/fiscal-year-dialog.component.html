<h2 mat-dialog-title>New fiscal year</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Create year"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-text label="Name" [control]="form.controls.name" />
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text label="First day" type="date" [control]="form.controls.startDate" />
      <ui-text label="Last day" type="date" [control]="form.controls.endDate" />
    </div>
    <mat-checkbox class="-ml-2 block" [formControl]="form.controls.withAdjustmentPeriod"
      >Add a year-end adjustment period (for audit entries)</mat-checkbox
    >
  </ui-form>
</mat-dialog-content>
