<h2 mat-dialog-title>
  {{ text.pay }} {{ expense.amount | money }}
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ expense.code }} · {{ expense.payeeName }}</span
  >
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.markAsPaid"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-select
      [label]="text.paidBy"
      [options]="methods"
      [required]="true"
      [control]="form.controls.method"
    />
    @if (form.controls.method.value === cash) {
      <p class="m-0 mb-4 text-sm text-on-surface-variant">
        {{ text.theCashComesOut }}
      </p>
    } @else {
      <ui-text [label]="text.bankOrChequeReference" [control]="form.controls.reference" />
    }
  </ui-form>
</mat-dialog-content>
