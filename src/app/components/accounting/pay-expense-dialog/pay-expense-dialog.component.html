<h2 mat-dialog-title>
  Pay {{ expense.amount | money }}
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ expense.code }} · {{ expense.payeeName }}</span
  >
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Mark as paid"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <ui-select
      label="Paid by"
      [options]="methods"
      [required]="true"
      [control]="form.controls.method"
    />
    @if (form.controls.method.value === cash) {
      <p class="m-0 mb-4 text-sm text-on-surface-variant">
        The cash comes out of your open drawer.
      </p>
    } @else {
      <ui-text label="Bank or cheque reference" [control]="form.controls.reference" />
    }
  </ui-form>
</mat-dialog-content>
