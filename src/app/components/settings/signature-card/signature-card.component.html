<section class="rounded-2xl border border-outline-variant bg-surface p-5">
  <h2 class="m-0 mb-1 text-base font-semibold">{{ text.title }}</h2>
  <p class="m-0 mb-4 text-sm text-on-surface-variant">{{ text.hint }}</p>

  <div class="mb-4 flex items-center gap-4">
    <div
      class="flex h-20 w-56 items-center justify-center rounded-xl border border-dashed border-outline-variant bg-white"
    >
      @if (current(); as url) {
        <img [src]="url" [alt]="text.current" class="max-h-16 max-w-52" />
      } @else {
        <span class="text-xs text-neutral-500">{{ text.none }}</span>
      }
    </div>
    @if (current()) {
      <button matButton type="button" class="!text-error" (click)="remove()">
        <mat-icon>delete</mat-icon> {{ text.remove }}
      </button>
    }
  </div>

  <mat-button-toggle-group class="mb-3" [value]="mode()" (change)="setMode($event.value)">
    <mat-button-toggle value="draw"><mat-icon>draw</mat-icon> {{ text.draw }}</mat-button-toggle>
    <mat-button-toggle value="upload"
      ><mat-icon>upload</mat-icon> {{ text.upload }}</mat-button-toggle
    >
  </mat-button-toggle-group>

  @if (mode() === 'draw') {
    <p class="m-0 mb-2 text-xs text-on-surface-variant">{{ text.drawHint }}</p>
    <canvas
      #pad
      class="block h-40 w-full touch-none rounded-xl border border-outline-variant bg-white"
      [attr.aria-label]="text.drawHint"
    ></canvas>
    <div class="mt-3 flex gap-2">
      <button matButton type="button" (click)="clear()">
        <mat-icon>ink_eraser</mat-icon> {{ text.clear }}
      </button>
      <button matButton="filled" type="button" [disabled]="busy()" (click)="saveDrawing()">
        <mat-icon>save</mat-icon> {{ text.save }}
      </button>
    </div>
  } @else {
    <p class="m-0 mb-2 text-xs text-on-surface-variant">{{ text.uploadHint }}</p>
    <input #file type="file" accept="image/png,image/jpeg" class="hidden" (change)="upload(file)" />
    <button matButton="filled" type="button" [disabled]="busy()" (click)="file.click()">
      <mat-icon>upload</mat-icon> {{ text.upload }}
    </button>
  }
</section>
