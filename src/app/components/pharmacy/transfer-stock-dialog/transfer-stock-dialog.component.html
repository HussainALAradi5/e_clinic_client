<h2 mat-dialog-title>Move lot {{ batch.batchNumber }}</h2>
<mat-dialog-content>
  <p class="m-0 mb-3 flex flex-wrap items-center gap-2 text-sm">
    <span class="font-medium">{{ batch.medication?.name }}</span>
    <ui-status enum="StockLocation" [value]="batch.location" />
    <span aria-hidden="true">→</span>
    <ui-status enum="StockLocation" [value]="to" />
  </p>
  <p class="m-0 mb-3 text-sm text-on-surface-variant">
    {{ batch.qtyOnHand | qty }} on hand here. The same batch and expiry go over; given in a session,
    the treatment room's stock is used first.
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Move"
    submitIcon="move_down"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-text label="Units to move" type="number" [control]="form.controls.quantity" />
    <ui-text
      label="Why (optional)"
      hint="e.g. weekly ward top-up"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
