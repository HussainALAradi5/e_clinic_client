<h2 mat-dialog-title>{{ text.moveLot }} {{ batch.batchNumber }}</h2>
<mat-dialog-content>
  <p class="m-0 mb-3 flex flex-wrap items-center gap-2 text-sm">
    <span class="font-medium">{{ batch.medication?.name }}</span>
    <ui-status enum="StockLocation" [value]="batch.location" />
    <span aria-hidden="true">→</span>
    <ui-status enum="StockLocation" [value]="to" />
  </p>
  <p class="m-0 mb-3 text-sm text-on-surface-variant">
    {{ batch.qtyOnHand | qty }} {{ text.onHandHereThe }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.move"
    submitIcon="move_down"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-text [label]="text.unitsToMove" type="number" [control]="form.controls.quantity" />
    <ui-text
      [label]="text.whyOptional"
      [hint]="text.eGWeeklyWard"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
