<h2 mat-dialog-title>{{ medication ? text.edit + medication.name : text.newMedication }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="medication ? text.save : text.addToCatalogue"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text [label]="text.code" [hint]="text.alsoItsPriceList" [control]="form.controls.code" />
      <ui-text
        [label]="text.barcodeGtin"
        icon="barcode"
        [hint]="text.scanThePackOr"
        [control]="form.controls.gtin"
      />
      <ui-text [label]="text.genericName" [control]="form.controls.genericName" />
      <ui-text [label]="text.brandName" [control]="form.controls.brandName" />
      <ui-select
        [label]="text.form"
        enum="MedicationForm"
        [required]="true"
        [control]="form.controls.form"
      />
      <ui-text [label]="text.strength" [hint]="text.eG500Mg" [control]="form.controls.strength" />
      <ui-select
        [label]="text.countedIn"
        enum="DispenseUnit"
        [hint]="text.theUnitStockPrescriptions"
        [required]="true"
        [control]="form.controls.unit"
      />
      <ui-text [label]="text.arabicName" [control]="form.controls.nameAr" />
      <ui-entity-select
        [label]="text.manufacturer"
        endpoint="reference/companies"
        icon="factory"
        [display]="companyName"
        [filter]="manufacturers"
        [initial]="$any(medication?.manufacturer ?? null)"
        [control]="form.controls.manufacturerId"
      />
      <ui-country-select [label]="text.madeIn" [control]="form.controls.originCountryCode" />
    </div>

    <h3 class="m-0 mb-2 mt-1 text-sm font-semibold text-on-surface-variant">
      {{ text.priceAndStock }}
    </h3>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-3">
      <ui-money [label]="text.pricePerUnit" [control]="form.controls.price" />
      <ui-text [label]="text.vat" type="number" [control]="form.controls.taxRate" />
      <ui-text
        [label]="text.reorderLevel"
        type="number"
        [hint]="text.flaggedAsLowAt"
        [control]="form.controls.reorderLevel"
      />
    </div>

    <div class="mb-3 flex flex-wrap gap-x-6">
      <mat-checkbox class="-ml-2" [formControl]="form.controls.requiresPrescription">{{
        text.prescriptionOnly
      }}</mat-checkbox>
      <mat-checkbox class="-ml-2" [formControl]="form.controls.isControlled">{{
        text.controlledDrugWitnessNeeded
      }}</mat-checkbox>
    </div>

    <ui-text [label]="text.storage" [hint]="text.eG28" [control]="form.controls.storageNotes" />
    <ui-text
      [label]="text.indicationsAndNotes"
      [multiline]="true"
      [rows]="3"
      [control]="form.controls.description"
    />
  </ui-form>
</mat-dialog-content>
