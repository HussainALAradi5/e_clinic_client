<h2 mat-dialog-title>Correct the count</h2>
<mat-dialog-content>
  <p class="m-0 mb-4 text-sm text-on-surface-variant">
    {{ batch.medication?.name }} · lot <span class="font-mono">{{ batch.batchNumber }}</span> ·
    {{ batch.qtyOnHand | qty }} on hand
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Correct"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <mat-button-toggle-group
      class="mb-4"
      hideSingleSelectionIndicator
      aria-label="Direction"
      [value]="direction()"
      (change)="setDirection($event.value)"
    >
      <mat-button-toggle value="out">Missing or damaged</mat-button-toggle>
      <mat-button-toggle value="in">Found more</mat-button-toggle>
    </mat-button-toggle-group>
    <ui-text label="Units" type="number" [control]="form.controls.quantity" />
    <ui-text label="Why" hint="e.g. broken vial, monthly count" [control]="form.controls.reason" />
    @if (needsApproval()) {
      <ui-select
        label="Approved by"
        hint="Another pharmacist confirms large corrections and controlled drugs"
        [options]="approvers()"
        [required]="true"
        [control]="form.controls.approvedBy"
      />
    }
  </ui-form>
</mat-dialog-content>
