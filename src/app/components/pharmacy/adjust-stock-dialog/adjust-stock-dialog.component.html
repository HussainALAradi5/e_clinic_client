<h2 mat-dialog-title>{{ text.correctTheCount }}</h2>
<mat-dialog-content>
  <p class="m-0 mb-4 text-sm text-on-surface-variant">
    {{ batch.medication?.name }} {{ text.lot }}
    <span class="font-mono">{{ batch.batchNumber }}</span> · {{ batch.qtyOnHand | qty }}
    {{ text.onHand }}
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.correct"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <mat-button-toggle-group
      class="mb-4"
      hideSingleSelectionIndicator
      [attr.aria-label]="text.direction"
      [value]="direction()"
      (change)="setDirection($event.value)"
    >
      <mat-button-toggle value="out">{{ text.missingOrDamaged }}</mat-button-toggle>
      <mat-button-toggle value="in">{{ text.foundMore }}</mat-button-toggle>
    </mat-button-toggle-group>
    <ui-text [label]="text.units" type="number" [control]="form.controls.quantity" />
    <ui-text [label]="text.why" [hint]="text.eGBrokenVial" [control]="form.controls.reason" />
    @if (needsApproval()) {
      <ui-select
        [label]="text.approvedBy"
        [hint]="text.anotherPharmacistConfirmsLarge"
        [options]="approvers()"
        [required]="true"
        [control]="form.controls.approvedBy"
      />
    }
  </ui-form>
</mat-dialog-content>
