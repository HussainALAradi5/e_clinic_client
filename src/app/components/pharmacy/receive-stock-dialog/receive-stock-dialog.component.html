<h2 mat-dialog-title>{{ text.receiveStock }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="text.receive"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <ui-entity-select
      [label]="text.medication"
      endpoint="pharmacy/medications"
      icon="medication"
      [display]="medicationName"
      [detail]="medicationDetail"
      [initial]="$any(data.medication)"
      [autofocus]="!data.medication"
      [control]="form.controls.medicationId"
      (picked)="picked.set($any($event))"
    />
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text
        [label]="text.lotBatchNumber"
        [hint]="text.asPrintedOnThe"
        [control]="form.controls.batchNumber"
      />
      <ui-text
        [label]="text.expiryDate"
        type="date"
        [hint]="text.mustBeAfterToday"
        [control]="form.controls.expiryDate"
      />
      <ui-text
        [label]="text.quantity"
        type="number"
        [hint]="unitHint()"
        [control]="form.controls.quantity"
      />
      <ui-money [label]="text.costPerUnit" [control]="form.controls.unitCost" />
      <ui-entity-select
        class="sm:col-span-2"
        [label]="text.supplier"
        endpoint="reference/companies"
        icon="local_shipping"
        [display]="companyName"
        [filter]="suppliers"
        [control]="form.controls.supplierId"
      />
    </div>

    <div class="mb-3 flex flex-wrap items-center gap-4 rounded-xl bg-surface-container px-4 py-3">
      <mat-checkbox class="-ml-2 flex-1" [formControl]="form.controls.createExpense">{{
        text.bookThePurchaseFor
      }}</mat-checkbox>
      <div class="text-right">
        <p class="m-0 text-xs text-on-surface-variant">{{ text.deliveryValue }}</p>
        <p class="m-0 text-lg font-semibold tabular-nums">{{ total() ?? '—' }}</p>
      </div>
    </div>
    @if (form.controls.createExpense.value) {
      <ui-text [label]="text.supplierInvoiceNumber" [control]="form.controls.vendorInvoiceNumber" />
    }
  </ui-form>
</mat-dialog-content>
