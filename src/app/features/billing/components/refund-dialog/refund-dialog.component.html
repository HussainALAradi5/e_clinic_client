<h2 mat-dialog-title>
  Refund
  <span class="block text-sm font-normal text-on-surface-variant"
    >{{ payment.code }} · {{ payment.amount | money }} by
    {{ payment.method | enumLabel: 'PaymentMethod' }} · {{ data.invoice.patient?.fullName }}</span
  >
</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    Up to {{ payment.refundable | money }} can be refunded. Another person approves the refund
    before it is paid out.
  </p>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Ask for approval"
    [compact]="true"
    [allowPristine]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-money label="Amount" [control]="form.controls.amount" />
      <ui-select
        label="Pay back by"
        [options]="methods"
        [required]="true"
        [control]="form.controls.method"
      />
    </div>
    <ui-text
      label="Reason"
      [multiline]="true"
      [rows]="3"
      [maxLength]="500"
      [control]="form.controls.reason"
    />
  </ui-form>
</mat-dialog-content>
