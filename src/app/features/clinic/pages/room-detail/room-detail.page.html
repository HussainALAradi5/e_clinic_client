@if (detail.error(); as error) {
  <ui-error [error]="error" (retry)="detail.load(id())" />
} @else if (detail.record(); as room) {
  <ui-page-header
    [title]="room.code + ' · ' + room.name"
    [subtitle]="room.type | enumLabel: 'RoomType'"
  >
    <ng-container actions>
      @if (!room.isDeleted) {
        @if (room.isInService) {
          <ui-button
            icon="build"
            [variant]="variants.Outlined"
            access="rooms.write"
            [action]="outOfService"
            >Out of service</ui-button
          >
        } @else {
          <ui-button
            icon="check_circle"
            [variant]="variants.Tonal"
            access="rooms.write"
            [action]="backInService"
            >Back in service</ui-button
          >
        }
      }
      <ui-entity-actions
        resource="rooms"
        noun="room"
        [record]="room"
        [edit]="edit"
        [archive]="archive"
        [unarchive]="unarchive"
        [remove]="remove"
        [restore]="restore"
      />
    </ng-container>
  </ui-page-header>

  @if (affected().length) {
    <div
      class="mb-4 rounded-xl border border-amber-300 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-950/40"
      role="alert"
    >
      <p class="m-0 mb-2 flex items-center gap-2 font-medium">
        <mat-icon>move_down</mat-icon> Bookings to move to another room
      </p>
      <app-appointment-rows [appointments]="affected()" />
    </div>
  }

  <mat-tab-group mat-stretch-tabs="false" animationDuration="0ms">
    <mat-tab label="Details">
      <div class="grid gap-4 pt-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
        <mat-card appearance="outlined" class="!p-5"><ui-facts [items]="facts()" /></mat-card>
        <mat-card appearance="outlined" class="!p-5">
          <div class="flex items-center gap-3">
            <h2 class="m-0 flex-1 text-base font-semibold">Bookings</h2>
            <ui-text class="w-44" label="Day" type="date" [control]="day" />
          </div>
          <app-appointment-rows empty="The room is free that day." [appointments]="bookings()" />
        </mat-card>
      </div>
    </mat-tab>
    <mat-tab label="History" *hasAccess="'audit.read_all | audit.read_own'">
      <ng-template matTabContent
        ><ui-audit-history class="block pt-4" type="room" [id]="room.id"
      /></ng-template>
    </mat-tab>
  </mat-tab-group>
} @else {
  <ui-skeleton [rows]="8" />
}
