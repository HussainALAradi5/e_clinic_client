<ui-resource-list
  resource="rooms"
  endpoint="rooms"
  title="Rooms"
  subtitle="Each booking type uses its own room types; a room out of service keeps its bookings until they are moved."
  emptyTitle="No rooms found"
  rowLink="/clinic/rooms/:id"
>
  <ui-button actions icon="add" access="rooms.create" [action]="create">New room</ui-button>
  <ng-template uiCell="code" let-row
    ><span class="font-mono">{{ row.code }}</span></ng-template
  >
  <ng-template uiCell="name" let-row
    ><span class="font-medium">{{ row.name }}</span></ng-template
  >
  <ng-template uiCell="type" let-row>{{ row.type | enumLabel: 'RoomType' }}</ng-template>
  <ng-template uiCell="department" let-row>{{ row.department?.name ?? '—' }}</ng-template>
  <ng-template uiCell="is_in_service" let-row>
    @if (row.isInService) {
      <span class="text-primary">In service</span>
    } @else {
      <span class="text-error">Out — {{ row.outOfServiceReason }}</span>
    }
  </ng-template>
</ui-resource-list>
