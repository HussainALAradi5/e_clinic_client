<ui-page-header
  title="Clinic holidays"
  subtitle="Closed days for everyone. Adding one lists the bookings it affects before anything is cancelled."
>
  <ui-button actions icon="add" access="schedules.create & schedules.read_all" [action]="add"
    >Add holiday</ui-button
  >
</ui-page-header>

<mat-card appearance="outlined" class="max-w-2xl !p-5">
  @for (h of holidays() ?? []; track h.id) {
    <div
      class="flex items-center gap-4 border-b border-outline-variant/60 py-2.5 text-sm last:border-0"
    >
      <span class="w-56 font-medium">{{ h.date | date: dateFormat }}</span>
      <span class="flex-1 text-on-surface-variant">{{ h.reason ?? 'Holiday' }}</span>
      <ui-button
        icon="delete"
        [variant]="variants.Text"
        access="schedules.delete & schedules.read_all"
        [confirm]="{
          title: 'Remove this holiday?',
          message: 'Normal hours apply that day again.',
          confirmLabel: 'Remove',
        }"
        [action]="remove.bind(this, h)"
        >Remove</ui-button
      >
    </div>
  } @empty {
    <p class="m-0 text-sm text-on-surface-variant">No holidays in the next three months.</p>
  }
</mat-card>
