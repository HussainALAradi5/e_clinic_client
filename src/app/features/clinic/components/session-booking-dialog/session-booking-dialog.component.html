<h2 mat-dialog-title>Book a session · {{ data.treatment.title }}</h2>
<mat-dialog-content>
  <p class="mt-0 text-sm text-on-surface-variant">
    {{ data.treatment.patient?.fullName }} · {{ summary() }}
  </p>
  <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
    <ui-select
      class="sm:col-span-2"
      label="Therapist or doctor"
      [required]="true"
      [options]="providers()"
      [control]="form.controls.providerId"
    />
    <ui-text label="Date" type="date" [control]="form.controls.date" />
    <ui-entity-select
      label="Room (optional)"
      endpoint="rooms"
      [display]="roomName"
      [filter]="sessionRooms"
      [control]="form.controls.roomId"
    />
  </div>
  <app-slot-picker
    class="mb-3"
    [providerId]="providerId()"
    [date]="date()"
    [type]="type"
    [roomId]="roomId()"
    [(start)]="start"
  />
  <ui-text label="Notes for the session" [control]="form.controls.notes" />
  @if (deadlineMissed() && canOverride) {
    <mat-checkbox class="-ml-2 mb-2 block" [formControl]="form.controls.override"
      >Book anyway — I accept the delay (recorded in the audit trail)</mat-checkbox
    >
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="ref.close()">Cancel</button>
  <ui-button icon="event_available" [disabled]="!start() || form.invalid" [action]="book"
    >Book session</ui-button
  >
</mat-dialog-actions>
