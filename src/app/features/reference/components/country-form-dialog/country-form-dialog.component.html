<h2 mat-dialog-title>
  <span aria-hidden="true">{{ flag }}</span> {{ data.country.name }} ({{ data.country.code }})
</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-text label="Name" [control]="form.controls.name" />
      <ui-text label="Nationality" [control]="form.controls.nationality" />
      <ui-text label="Dial code" hint="e.g. +973" [control]="form.controls.phoneCode" />
      <ui-text
        label="Order in pickers"
        type="number"
        hint="Lower comes first"
        [control]="form.controls.sortOrder"
      />
    </div>
    <mat-slide-toggle [formControl]="form.controls.isActive">Shown in pickers</mat-slide-toggle>
    <p class="mb-0 mt-1 text-xs text-on-surface-variant">
      Hiding a country keeps it on existing records; it only disappears from pickers.
    </p>
  </ui-form>
</mat-dialog-content>
