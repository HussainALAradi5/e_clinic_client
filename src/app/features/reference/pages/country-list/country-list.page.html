<ui-resource-list
  resource="countries"
  endpoint="reference/countries"
  title="Countries"
  subtitle="Used for nationalities, addresses, companies and medication origin. Hidden countries stay on existing records."
  emptyTitle="No countries match"
  (rowClick)="edit($event)"
>
  <ng-template uiCell="code" let-row>
    <span aria-hidden="true">{{ flag(row.code) }}</span>
    <span class="ml-1 tabular-nums">{{ row.code }}</span>
  </ng-template>
  <ng-template uiCell="is_active" let-row>{{ row.isActive ? 'Yes' : 'Hidden' }}</ng-template>
</ui-resource-list>
