<h2 mat-dialog-title>{{ expense ? 'Edit expense ' + expense.code : 'New expense' }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="expense ? 'Save' : 'Save draft'"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <div class="mb-4">
      <p class="m-0 mb-2 text-sm text-on-surface-variant">Paid to</p>
      <mat-button-toggle-group
        hideSingleSelectionIndicator
        aria-label="Paid to"
        [value]="payeeKind()"
        (change)="setPayeeKind($event.value)"
      >
        <mat-button-toggle value="company">A company on file</mat-button-toggle>
        <mat-button-toggle value="name">Someone else</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      @if (payeeKind() === 'company') {
        <ui-entity-select
          class="sm:col-span-2"
          label="Company"
          endpoint="reference/companies"
          icon="domain"
          [display]="companyName"
          [initial]="$any(expense?.payeeCompany ?? null)"
          [control]="form.controls.payeeCompanyId"
        />
      } @else {
        <ui-text class="sm:col-span-2" label="Paid to (name)" [control]="form.controls.payee" />
      }
      <ui-text
        class="sm:col-span-2"
        label="What for"
        [maxLength]="500"
        [control]="form.controls.description"
      />
      <ui-select
        label="Category"
        enum="ExpenseCategory"
        [required]="true"
        [control]="form.controls.category"
      />
      <ui-text label="Date" type="date" [control]="form.controls.expenseDate" />
      <ui-money label="Amount (VAT included)" [control]="form.controls.amount" />
      <ui-money
        label="Of which VAT"
        hint="Recoverable input VAT"
        [control]="form.controls.taxAmount"
      />
      <ui-text label="Vendor invoice number" [control]="form.controls.vendorInvoiceNumber" />
      <ui-entity-select
        label="Department (optional)"
        endpoint="hr/departments"
        [display]="departmentName"
        [initial]="$any(expense?.department ?? null)"
        [control]="form.controls.departmentId"
      />
      <ui-entity-select
        class="sm:col-span-2"
        label="Expense account (optional)"
        endpoint="accounting/accounts"
        icon="account_tree"
        hint="Left empty, the category's usual account is used."
        [display]="accountName"
        [filter]="expenseAccounts"
        [initial]="$any(expense?.expenseAccount ?? null)"
        [control]="form.controls.expenseAccountId"
      />
    </div>
  </ui-form>
</mat-dialog-content>
