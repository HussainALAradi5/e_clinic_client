<h2 mat-dialog-title>{{ account ? 'Edit account' : 'New account' }}</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    [submitLabel]="account ? 'Save' : 'Create account'"
    [compact]="true"
    (saved)="close()"
    (cancelled)="ref.close()"
  >
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-[10rem_1fr]">
      @if (!account) {
        <ui-text label="Code" hint="3–10 digits, e.g. 4110" [control]="form.controls.code" />
      } @else {
        <ui-text label="Code" [control]="form.controls.code" hint="The code never changes" />
      }
      <ui-text label="Name" [control]="form.controls.name" />
    </div>
    <div class="grid grid-cols-1 gap-x-4 sm:grid-cols-2">
      <ui-select label="Type" enum="AccountType" [required]="true" [control]="form.controls.type" />
      <ui-entity-select
        label="Parent group"
        endpoint="accounting/accounts"
        hint="Empty = top level"
        [display]="accountName"
        [filter]="parentFilter()"
        [initial]="$any(parent)"
        [control]="form.controls.parentId"
      />
    </div>
    @if (!account) {
      <mat-checkbox class="-ml-2 mb-2 block" [formControl]="form.controls.isGroup">
        Group account — holds other accounts, never posted to
      </mat-checkbox>
    }
    <ui-text label="Description" [multiline]="true" [control]="form.controls.description" />
  </ui-form>
</mat-dialog-content>
