<details class="group rounded-2xl border border-dashed border-outline-variant" open>
  <summary
    class="flex cursor-pointer list-none items-center gap-2 px-4 py-3 text-sm font-semibold [&::-webkit-details-marker]:hidden"
  >
    <mat-icon class="!size-5 !text-xl text-primary">science</mat-icon>
    <span class="flex-1">Demo accounts</span>
    <mat-icon
      class="!size-5 !text-xl text-on-surface-variant transition-transform group-open:rotate-180"
      >expand_more</mat-icon
    >
  </summary>

  <div class="px-4 pb-4">
    <p class="mt-0 mb-3 text-xs text-on-surface-variant">
      Pick a role to fill the form. Every account uses the password
      <code class="rounded bg-surface-container px-1.5 py-0.5 font-semibold text-on-surface">{{
        demo().password
      }}</code
      >.
    </p>
    <ul class="m-0 grid list-none grid-cols-2 gap-1.5 p-0">
      @for (account of demo().accounts; track account.email) {
        <li>
          <button
            type="button"
            class="demo-account"
            [class.refused]="account.refused"
            [matTooltip]="account.name + ', ' + account.email"
            (click)="picked.emit(account)"
          >
            <mat-icon class="!size-[1.125rem] !text-[1.125rem]">{{ account.icon }}</mat-icon>
            <span class="flex-1 truncate text-left">{{ account.role }}</span>
            @if (account.twoFactor) {
              <span
                class="rounded bg-primary-container px-1 text-[0.6875rem] font-semibold text-on-primary-container"
                >2FA</span
              >
            }
          </button>
        </li>
      }
    </ul>
  </div>
</details>
