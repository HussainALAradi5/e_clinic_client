<span class="icon-badge mb-6" aria-hidden="true"
  ><span class="material-symbols-outlined">waving_hand</span></span
>
<h1 class="m-0 text-3xl font-bold tracking-tight">Welcome back</h1>
<p class="mt-2 mb-8 text-on-surface-variant">Sign in with your clinic email to continue.</p>

<ui-form
  [form]="form"
  [submit]="submit"
  submitLabel="Sign in"
  submitIcon="login"
  [cancelLabel]="null"
  [block]="true"
>
  <ui-text
    label="Email"
    type="email"
    icon="mail"
    autocomplete="username"
    [autofocus]="true"
    [control]="form.controls.email"
  />
  <div>
    <ui-text
      label="Password"
      type="password"
      icon="lock"
      autocomplete="current-password"
      [control]="form.controls.password"
    />
    <a
      routerLink="/password/forgot"
      class="float-right -mt-2 text-sm font-medium text-primary no-underline hover:underline"
      >Forgot password?</a
    >
  </div>
</ui-form>

<p class="mt-6 mb-0 text-center text-sm text-on-surface-variant">
  New patient? Ask reception to create your portal account.
</p>

@if (demoLogins; as demo) {
  <app-demo-accounts class="mt-8" [demo]="demo" (picked)="useDemo($event)" />
}
