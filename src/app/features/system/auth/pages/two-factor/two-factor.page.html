<h1 class="m-0 text-xl font-semibold">Two-factor verification</h1>
<p class="mt-1 mb-6 text-sm text-on-surface-variant">
  @if (useRecoveryCode()) {
    Enter one of your recovery codes. Each code works once.
  } @else {
    Enter the 6-digit code from your authenticator app for {{ session.challenge()?.email }}.
  }
</p>

<ui-form [form]="form" [submit]="submit" submitLabel="Verify" [cancelLabel]="null" [compact]="true">
  @if (useRecoveryCode()) {
    <ui-text label="Recovery code" autocomplete="off" [control]="form.controls.code" />
  } @else {
    <ui-text
      label="Code"
      type="text"
      autocomplete="one-time-code"
      [maxLength]="6"
      [control]="form.controls.code"
    />
  }
</ui-form>

<div class="mt-4 flex justify-between text-sm">
  <button matButton type="button" (click)="toggleMode()">
    {{ useRecoveryCode() ? 'Use the authenticator code' : 'Use a recovery code' }}
  </button>
  <a matButton routerLink="/login">Back to sign in</a>
</div>
