<h2 mat-dialog-title>Contact details</h2>
<mat-dialog-content>
  <ui-form
    [form]="form"
    [submit]="submit"
    submitLabel="Save details"
    [compact]="true"
    (cancelled)="ref.close()"
  >
    <div class="grid gap-x-4 sm:grid-cols-2">
      <ui-text label="Mobile" type="tel" icon="call" [control]="form.controls.phone" />
      <ui-text
        label="Email"
        type="email"
        icon="mail"
        hint="You sign in with this address"
        [control]="form.controls.email"
      />
    </div>
    <ui-address-fields [form]="form.controls.address" />
    <h3 class="m-0 mt-2 mb-2 text-sm font-semibold">Emergency contact</h3>
    <div class="grid gap-x-4 sm:grid-cols-2">
      <ui-text label="Name" [control]="form.controls.emergencyContactName" />
      <ui-text label="Relation" [control]="form.controls.emergencyContactRelation" />
      <ui-text label="Phone" type="tel" [control]="form.controls.emergencyContactPhone" />
    </div>
  </ui-form>
</mat-dialog-content>
