# Unit tests (Vitest) and the production build on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build
